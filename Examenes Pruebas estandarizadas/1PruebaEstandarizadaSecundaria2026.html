const ITEMS=[
{n:1,b:"Geometria",q:`<p>Una antena A que emite una senal para radio se ubica a 8 km al este del mercado M de un poblado, el cual se considera como origen. Si el alcance maximo de la senal que emite la antena es de 10 km a su alrededor, entonces, la representacion grafica del alcance maximo de la senal corresponde a</p>`,A:TIKZ_FIG.item1A,B:TIKZ_FIG.item1B,C:TIKZ_FIG.item1C,D:TIKZ_FIG.item1D,k:"B",e:"La antena esta en (8,0) y el radio del alcance es 10 km; por eso la circunferencia correcta tiene centro en 8 y extremo derecho en 18."},
{n:2,b:"Geometria",q:`<p>La siguiente representacion grafica, en la que las unidades estan en centimetros, muestra la ubicacion del centro <span class="math">P</span> de la base circular de una pecera y la circunferencia correspondiente al borde de esa base.</p>${TIKZ_FIG.item2}<p>De acuerdo con la informacion anterior, ¿cual es la representacion algebraica, en la que las unidades estan en centimetros, de la circunferencia correspondiente al borde de la base de la pecera?</p>`,A:"(x + 10)<sup>2</sup> + (y + 6)<sup>2</sup> = 36",B:"(x - 10)<sup>2</sup> + (y - 6)<sup>2</sup> = 36",C:"(x - 6)<sup>2</sup> + (y - 10)<sup>2</sup> = 36",D:"(x - 10)<sup>2</sup> + (y - 6)<sup>2</sup> = 6",k:"B",e:"El centro es (10,6) y el radio es 6, por tanto r al cuadrado es 36."},
{n:3,b:"Geometria",q:`<p>Una antena de telecomunicaciones T emite una senal que permite a los telefonos celulares, ubicados a 13 km o menos alrededor de esa antena, realizar y recibir llamadas. En una representacion grafica, la ubicacion de la antena corresponde al punto T(5,12).</p><p>Durante una revision tecnica se registraron tres telefonos celulares ubicados en los puntos R(10,24), S(18,12) y U(17,18).</p><p>La siguiente representacion grafica, en la que las unidades estan en kilometros, muestra la ubicacion de la antena y la circunferencia correspondiente al alcance maximo de la senal.</p>${TIKZ_FIG.item3}<p>De acuerdo con la informacion anterior, ¿en cual de esos telefonos se pueden realizar y recibir llamadas por medio de la senal de esa antena?</p>`,A:"Solo en R.",B:"Solo en S.",C:"En R y en S.",D:"En R, en S y en U.",k:"C",e:"R y S estan a 13 km del centro; U esta a mas de 13 km."},
{n:4,b:"Geometria",q:`<p>En una finca se desea construir un estanque circular para peces. El centro del estanque <span class="math">C</span> se ubicara a 9 m al oeste y 4 m al sur de un arbol <span class="math">A</span>, el cual se considera como origen. Ademas, el borde del estanque debe quedar a 7 m del centro.</p><p>La siguiente representacion grafica, en la que las unidades estan en metros, muestra la ubicacion del arbol, del centro del estanque y de la circunferencia correspondiente al borde del estanque.</p>${TIKZ_FIG.item4}<p>¿Cual de las siguientes representaciones algebraicas, en la que las unidades estan en metros, corresponde a la circunferencia que representa el borde de ese estanque?</p>`,A:"(x - 9)<sup>2</sup> + (y - 4)<sup>2</sup> = 49",B:"(x + 9)<sup>2</sup> + (y + 4)<sup>2</sup> = 49",C:"(x + 9)<sup>2</sup> + (y + 4)<sup>2</sup> = 7",D:"(x - 4)<sup>2</sup> + (y - 9)<sup>2</sup> = 49",k:"B",e:"El centro es (-9,-4) y el radio es 7, asi que r al cuadrado es 49."},
{n:5,b:"Geometria",q:`<p>En un plano cartesiano, la circunferencia C tiene centro en A(6,4) y radio 5. Se le aplica una traslacion de 8 unidades hacia la derecha y 3 unidades hacia abajo, obteniendo C'.</p><p>¿Cual representacion algebraica corresponde a C'?</p>`,A:"(x - 14)<sup>2</sup> + (y - 1)<sup>2</sup> = 25",B:"(x + 14)<sup>2</sup> + (y + 1)<sup>2</sup> = 25",C:"(x - 14)<sup>2</sup> + (y - 7)<sup>2</sup> = 25",D:"(x - 6)<sup>2</sup> + (y - 4)<sup>2</sup> = 25",k:"A",e:"El centro pasa de (6,4) a (14,1); el radio permanece 5."},
{n:6,b:"Geometria",q:`<p>En un centro recreativo, una piscina circular esta representada en un plano por la circunferencia <span class="math">C</span>, con centro en <span class="math">A(4,3)</span> y radio 4. Debido a una remodelacion del terreno, la piscina se trasladara 12 unidades hacia la derecha y 5 unidades hacia arriba, obteniendo la nueva ubicacion representada por la circunferencia <span class="math">C'</span>.</p><p>¿Cual de las siguientes representaciones graficas corresponde a esa traslacion?</p>`,A:TIKZ_FIG.item6A,B:TIKZ_FIG.item6B,C:TIKZ_FIG.item6C,D:TIKZ_FIG.item6D,k:"C",e:"El nuevo centro es (4+12, 3+5) = (16,8)."},
{n:7,b:"Geometria",q:`<p>En una plaza, el borde de una zona circular de juego esta representado por la circunferencia</p><p class="math">(x - 18)<sup>2</sup> + (y - 10)<sup>2</sup> = 36,</p><p>donde las unidades estan en metros. Por una remodelacion, toda la zona se trasladara 7 m hacia el oeste y 4 m hacia el norte.</p><p>¿Cual sera la representacion algebraica del borde de la zona circular despues de la traslacion?</p>`,A:"(x - 11)<sup>2</sup> + (y - 14)<sup>2</sup> = 36",B:"(x - 25)<sup>2</sup> + (y - 14)<sup>2</sup> = 36",C:"(x - 11)<sup>2</sup> + (y - 6)<sup>2</sup> = 36",D:"(x - 18)<sup>2</sup> + (y - 10)<sup>2</sup> = 36",k:"A",e:"El centro (18,10) se mueve a (11,14); el radio no cambia."},
{n:8,b:"Geometria",q:`<p>En las instalaciones de un centro recreativo hay una fuente circular de 16 m de diametro. Si se crea un sendero rectilineo que pasa por los puntos (20,4) y (20,14).</p><p>La siguiente representacion grafica, cuyas unidades estan en metros, muestra el origen <span class="math">O</span> y <span class="math">C</span> del centro de la fuente:</p>${TIKZ_FIG.item8}<p>De acuerdo con la informacion anterior, la recta que representa ese sendero, con respecto a la circunferencia que representa el borde de esa fuente, es</p>`,A:"exterior.",B:"secante.",C:"tangente.",D:"Ninguna de las anteriores.",k:"A",e:"La recta x=20 esta a 10 m del centro (10,9), distancia mayor que el radio 8."},
{n:9,b:"Geometria",q:`<p>Un juego consiste en lanzar una ficha desde cierta distancia hacia un objetivo circular colocado en el piso de un salon de actividades. La medida del radio de ese objetivo es 5 m.</p><p>La siguiente representacion grafica, cuyas unidades estan en metros, muestra la circunferencia que representa el borde del objetivo:</p>${TIKZ_FIG.item9}<p>Ademas, durante el juego:</p><ul><li>Mariela lanzo una ficha y esta se ubico en el punto correspondiente a (12,12).</li><li>Andres lanzo una ficha y esta se ubico en el punto correspondiente a (4,8).</li><li>Valeria lanzo una ficha y esta se ubico en el punto correspondiente a (15,9).</li><li>Esteban lanzo una ficha y esta se ubico en el punto correspondiente a (8,4).</li></ul><p>De acuerdo con la informacion anterior, ¿cual de esas personas lanzo la ficha que se ubico en el exterior de ese objetivo?</p>`,A:"Mariela.",B:"Andres.",C:"Valeria.",D:"Esteban.",k:"C",e:"Valeria esta a una distancia mayor que 5 del centro del objetivo."},
{n:10,b:"Geometria",q:`<p>Una rotonda tiene forma circular y la medida de su diametro es 24 m. Las rectas <span class="math">h</span> y <span class="math">j</span> representan senderos que pasan por el centro de la rotonda. Las rectas <span class="math">k</span> y <span class="math">n</span> representan otros senderos del lugar. La siguiente representacion grafica, en la que las unidades estan en metros, muestra la rotonda y esos senderos:</p>${TIKZ_FIG.item10}<p>De acuerdo con la informacion anterior, ¿cuales de esas rectas, que representan senderos, son perpendiculares entre si?</p>`,A:"j y k.",B:"h y j.",C:"k y n.",D:"j y n.",k:"B",e:"h es vertical y j es horizontal; por eso son perpendiculares."},
{n:11,b:"Geometria",q:`<p>Una antena de telecomunicaciones emite una senal que permite a los telefonos celulares, que se encuentran a 6 km o menos alrededor de esa antena, realizar y recibir llamadas. A continuacion, se muestra la representacion grafica, en la que las unidades estan en kilometros, de la circunferencia que corresponde al alcance maximo de la senal que emite esa antena:</p>${TIKZ_FIG.item11}<p>De acuerdo con la informacion anterior, si las ubicaciones que tienen los telefonos celulares <span class="math">W</span>, <span class="math">K</span>, <span class="math">L</span> y <span class="math">M</span> corresponden, respectivamente, a los puntos (10,12), (14,8), (2,2) y (7,15), entonces ¿en cual de esos telefonos se pueden realizar y recibir llamadas por medio de la senal de esa antena?</p>`,A:"W",B:"K",C:"L",D:"M",k:"A",e:"W esta a 5 km del centro, dentro del alcance de 6 km."},
{n:12,b:"Geometria",q:`<p>En un centro educativo se destinara una zona con forma poligonal para construir un jardin. La siguiente representacion grafica, en la que las unidades estan en metros, muestra la forma de esa zona:</p>${TIKZ_FIG.item12}<p>De acuerdo con la informacion anterior, ¿cuantos metros cuadrados mide el area de la zona destinada para ese jardin?</p>`,A:"32",B:"40",C:"44",D:"56",k:"C",e:"Se puede descomponer en un rectangulo de area 32 y un triangulo de area 12; total 44."},
{n:13,b:"Geometria",q:`<p>Una empresa fabrica senales decorativas con forma de hexagono regular. Para colocar un refuerzo, se mide la distancia entre dos vertices opuestos de una de esas senales y se obtiene 18 cm.</p>${TIKZ_FIG.item13}<p>Si se coloca una cinta alrededor de todo el borde de esa senal, ¿cuantos centimetros de cinta se necesitan?</p>`,A:"27",B:"36",C:"54",D:"108",k:"C",e:"En un hexagono regular, la distancia entre vertices opuestos es el doble del lado; el lado mide 9 y el perimetro 54."},
{n:14,b:"Geometria",q:`<p>Un artesano diseno una pieza decorativa para la entrada de un salon comunal. La siguiente representacion grafica muestra la forma de esa pieza sobre una cuadricula. La medida del lado de cada cuadrado de la cuadricula es 1 m.</p>${TIKZ_FIG.item14}<p>De acuerdo con la informacion anterior, la superficie de esa pieza decorativa, en metros cuadrados, es mayor que</p>`,A:"22 y menor que 23.",B:"18 y menor que 20.",C:"16 y menor que 18.",D:"24 y menor que 26.",k:"A",e:"La figura equivale a un rectangulo de 16 mas una semicircunferencia de radio 2, aproximadamente 22,28."},
{n:15,b:"Geometria",q:`<p>Para una actividad escolar se arma un mural con cinco piezas cuadradas congruentes. Cada pieza tiene 4 dm de lado.</p>${TIKZ_FIG.item15}<p>Si se coloca una cinta alrededor del borde exterior, ¿cuantos decimetros se necesitan?</p>`,A:"32",B:"40",C:"48",D:"80",k:"C",e:"El borde exterior tiene 12 lados de una pieza; 12 x 4 = 48 dm."},
{n:16,b:"Geometria",q:`<p>En un taller se elaboran recuerdos a partir de esferas de acrilico. A cada esfera se le realiza un corte plano que pasa por el centro de la esfera.</p><p>De acuerdo con la informacion anterior, la seccion plana obtenida en cada recuerdo, producto del corte realizado a esa esfera, corresponde a una</p>`,A:"circunferencia.",B:"hiperbola.",C:"parabola.",D:"recta.",k:"A",e:"Un plano que corta una esfera por su centro produce una circunferencia."},
{n:17,b:"Geometria",q:`<p>Considere la siguiente informacion:</p><p>Una persona artesana trabaja con un bloque de cera con forma de cilindro circular recto, cuyo radio de la base mide 8 cm y la altura del cilindro mide 24 cm. Para elaborar una pieza decorativa, realiza un corte plano al bloque, que pasa por el centro de las bases y es perpendicular a estas.</p><p>De acuerdo con la informacion anterior, ¿cual es el perimetro de la seccion plana obtenida producto del corte realizado a ese bloque?</p>`,A:"32 cm",B:"64 cm",C:"80 cm",D:"192 cm",k:"C",e:"La seccion es un rectangulo de lados 24 y 16; su perimetro es 2(24+16)=80."},
{n:18,b:"Geometria",q:`<p>Maria debe hacer cinco sombreros de cumpleanos como proyecto para un curso de fiestas infantiles. Ella confecciono los sombreros con un diametro de 14 cm y una altura de 25 cm. Si quiere pegar cinta formando una circunferencia paralela a la base y a 10 cm de altura sobre la base del cono, como se muestra en la siguiente figura, ¿cuanta cinta debe comprar, aproximadamente, para los cinco sombreros?</p>${TIKZ_FIG.item18}`,A:"42 cm",B:"84 cm",C:"132 cm",D:"220 cm",k:"C",e:"A esa altura el radio es 4,2 cm; una circunferencia mide aproximadamente 26,4 cm y cinco miden 132 cm."},
{n:19,b:"Geometria",q:`<p>Para responder los items 19 y 20, considere la siguiente representacion grafica.</p><p>En el plano de diseno de una institucion educativa, el poligono ABCD representa la forma de una zona verde que sera reproducida en diferentes posiciones del patio.</p>${TIKZ_FIG.item19}<p>Si al poligono ABCD se le aplica una reflexion respecto a la recta dada por y = -x, entonces, ¿cual es la imagen del punto A?</p>`,A:"(-2,-6)",B:"(6,-2)",C:"(-6,2)",D:"(2,6)",k:"C",e:"La reflexion respecto a y = -x transforma (x,y) en (-y,-x). A(-2,6) pasa a (-6,2)."},
{n:20,b:"Geometria",q:`<p>En el siguiente plano de diseno se muestra el poligono ABCD.</p>${TIKZ_FIG.item19}<p>En el mismo plano de diseno, al poligono ABCD se le aplica una homotecia de razon k = -2 con centro en el origen y, luego, una traslacion de 3 unidades hacia la derecha.</p><p>¿Cual es la imagen del punto C luego de aplicar ambas transformaciones?</p>`,A:"(-15,8)",B:"(15,-8)",C:"(9,-8)",D:"(12,-5)",k:"B",e:"C(-6,4), bajo la homotecia de razon -2, pasa a (12,-8). Luego se traslada a (15,-8)."},
{n:21,b:"Geometria",q:`<p>En una aplicacion de mapas, la ubicacion de una camara de seguridad se representa por el punto P(3,-2) en un plano cartesiano. Para ajustar la orientacion del mapa en la pantalla, el sistema aplica una rotacion de 90 grados en sentido antihorario alrededor del origen.</p><p>¿Cuales son las coordenadas del punto que representa la nueva ubicacion de la camara en la pantalla?</p>`,A:"(-2,-3)",B:"(2,3)",C:"(-3,2)",D:"(3,2)",k:"B",e:"Una rotacion de 90 grados antihoraria transforma (x,y) en (-y,x). Por tanto, (3,-2) pasa a (2,3)."},

{n:23,b:"Geometria",q:`<p>En el siguiente plano cartesiano se muestra el poligono MNPQR.</p><svg xmlns="http://www.w3.org/2000/svg" class="fig" width="320" height="280"><line x1="30" y1="35" x2="280" y2="35" stroke="black" stroke-width="1.5"/><polygon points="287,35 280,31 280,39" fill="black"/><polygon points="23,35 30,31 30,39" fill="black"/><line x1="70" y1="275" x2="70" y2="10" stroke="black" stroke-width="1.5"/><polygon points="70,3 66,10 74,10" fill="black"/><polygon points="70,282 66,275 74,275" fill="black"/><text x="291" y="39" font-size="14" font-style="italic" font-family="serif">x</text><text x="74" y="8" font-size="14" font-style="italic" font-family="serif">y</text><line x1="110" y1="32" x2="110" y2="238" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/><line x1="190" y1="32" x2="190" y2="238" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/><line x1="230" y1="32" x2="230" y2="238" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/><line x1="67" y1="75"  x2="233" y2="75"  stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/><line x1="67" y1="115" x2="233" y2="115" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/><line x1="67" y1="195" x2="233" y2="195" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/><line x1="67" y1="235" x2="233" y2="235" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/><text x="110" y="27" font-size="12" text-anchor="middle" font-family="serif">1</text><text x="190" y="27" font-size="12" text-anchor="middle" font-family="serif">3</text><text x="230" y="27" font-size="12" text-anchor="middle" font-family="serif">4</text><text x="265" y="27" font-size="12" text-anchor="middle" font-family="serif">5</text><text x="62" y="79"  font-size="12" text-anchor="end" font-family="serif">-1</text><text x="62" y="119" font-size="12" text-anchor="end" font-family="serif">-2</text><text x="62" y="199" font-size="12" text-anchor="end" font-family="serif">-4</text><text x="62" y="239" font-size="12" text-anchor="end" font-family="serif">-5</text><polygon points="110,115 230,75 230,235 110,235 190,195" fill="none" stroke="black" stroke-width="1.5" stroke-linejoin="round"/><circle cx="110" cy="115" r="3" fill="black"/><circle cx="230" cy="75"  r="3" fill="black"/><circle cx="230" cy="235" r="3" fill="black"/><circle cx="110" cy="235" r="3" fill="black"/><circle cx="190" cy="195" r="3" fill="black"/><text x="103" y="111" font-size="13" text-anchor="end" font-style="italic" font-family="serif">M</text><text x="234" y="71"  font-size="13" text-anchor="start" font-style="italic" font-family="serif">N</text><text x="234" y="243" font-size="13" text-anchor="start" font-style="italic" font-family="serif">P</text><text x="103" y="243" font-size="13" text-anchor="end" font-style="italic" font-family="serif">Q</text><text x="194" y="201" font-size="13" text-anchor="start" font-style="italic" font-family="serif">R</text></svg><p>Si al poligono MNPQR se le aplica una homotecia de razon k = &minus;2 con centro en el origen y, luego, una traslacion de 2 unidades hacia la derecha, &iquest;cual es la imagen del punto R luego de aplicar ambas transformaciones?</p>`,A:`(-6, 6)`,B:`(-4, 8)`,C:`(-10, 8)`,D:`(-6, 10)`,k:"B",e:`Homotecia k=&minus;2 sobre R(3,&minus;4): resultado (&minus;6, 8). Traslacion 2 unidades a la derecha: (&minus;4, 8).`},
{n:24,b:"Relaciones y Algebra",q:`<p>En una estacion meteorologica se registra la relacion entre la variable d, que corresponde al dia de medicion, y la variable r, que corresponde a la cantidad de lluvia acumulada, en milimetros. Cada una de las siguientes tablas muestra una relacion obtenida durante tres semanas distintas.</p><p><strong>I.</strong></p>${tableRelation()}<p>De acuerdo con la informacion anterior, ¿cual tabla muestra una relacion que corresponde a una funcion?</p>`,A:"I",B:"II",C:"III",D:"IV",k:"B",e:"En la tabla II, cada valor de d tiene una unica imagen. En I, III y IV se repite un valor de d con dos valores distintos de r."},
{n:25,b:"Relaciones y Algebra",q:`<p>La siguiente representacion grafica corresponde al monto C(x), en colones, que se debe pagar por el uso de un parqueo, en funcion del tiempo x, en horas, que permanece estacionado un vehiculo.</p>${TIKZ_FIG.item23}<p>De acuerdo con la informacion anterior, si un vehiculo permanece estacionado durante 3 horas, entonces, ¿cual monto se debe pagar por el uso del parqueo?</p>`,A:"800 colones",B:"1500 colones",C:"3000 colones",D:"5000 colones",k:"B",e:"En la grafica, el punto cerrado en x = 3 esta en C(x) = 1500."},
{n:26,b:"Relaciones y Algebra",q:`<p>Para responder los items 26 y 27, considere la siguiente informacion.</p><p>La siguiente representacion grafica corresponde a la funcion n, que determina la cantidad de botellas de agua disponibles, en cientos, en una bodega de emergencia, en funcion del tiempo x, en dias, desde el inicio de una jornada de distribucion, con 0 &le; x &le; 30.</p>${TIKZ_FIG.item24}<p>¿Cual fue la cantidad de botellas de agua disponibles en la bodega el dia 15 desde el inicio de la jornada?</p>`,A:"15 cientos",B:"18 cientos",C:"24 cientos",D:"28 cientos",k:"C",e:"En la grafica, al dia 15 le corresponde n(15) = 24."},
{n:27,b:"Relaciones y Algebra",q:`<p>Para responder este item, considere nuevamente la grafica de la funcion <span class="math">n</span>, que determina la cantidad de botellas de agua disponibles en una bodega, en funcion del tiempo <span class="math">x</span> en dias, desde el inicio de una jornada.</p>${TIKZ_FIG.item24}<p>Durante todo ese tiempo, ¿cual fue la menor cantidad de botellas de agua disponibles en la bodega?</p>`,A:"6 cientos",B:"12 cientos",C:"24 cientos",D:"30 cientos",k:"A",e:"El menor valor observado en la grafica es 6, alcanzado al dia 30."},
{n:28,b:"Relaciones y Algebra",q:`<p>En una aplicacion de entrenamiento, la funcion f asigna a cada rutina su duracion recomendada, en minutos, y la funcion g asigna a cada duracion la cantidad de puntos que obtiene una persona usuaria. Se sabe que</p><p class="math">f(x)=4x+10 &nbsp;&nbsp; y &nbsp;&nbsp; g(x)=2x-15.</p><p>Si x representa el nivel de una rutina, &iquest;cual es el valor de (g o f)(5)?</p>`,A:"15",B:"45",C:"55",D:"75",k:"B",e:"Primero, f(5)=4(5)+10=30. Luego, g(30)=2(30)-15=45."},
{n:29,b:"Relaciones y Algebra",q:`<p>La siguiente representacion grafica corresponde a la funcion p, que determina la presion p(t), en kilopascales, registrada por un sensor industrial en funcion del tiempo t, en minutos, desde que se inicia una prueba, con 0 &le; t &le; 8.</p>${TIKZ_FIG.item27}<p>De acuerdo con la informacion anterior, &iquest;cual representacion grafica corresponde a p<sup>-1</sup>?</p>`,A:TIKZ_FIG.item27A,B:TIKZ_FIG.item27B,C:TIKZ_FIG.item27C,D:TIKZ_FIG.item27D,k:"D",e:"La grafica de la inversa se obtiene al intercambiar coordenadas: (0,6) pasa a (6,0) y (8,2) pasa a (2,8)."},
{n:30,b:"Relaciones y Algebra",q:`<p>Considere la siguiente informacion:</p><p>En un vivero se usa la funcion <span class="math">a</span>, que determina la altura <span class="math">a(s)</span>, en centimetros, de una planta de albahaca en funcion del tiempo <span class="math">s</span>, en semanas, desde que se trasplanto, dada por</p><p class="math">a(s)=7s+18,</p><p>donde <span class="math">s</span> representa el tiempo en semanas, con 2 &le; s &le; 9.</p><p>De acuerdo con la informacion anterior, si se requiere determinar el criterio de la funcion inversa de <span class="math">a</span>, entonces, &iquest;cual opcion corresponde a ese criterio?</p>`,A:`<span class="math">s(a) = 7a + 18</span>`,B:`<span class="math">s(a) = </span><span class="frac"><span class="top">a - 18</span><span class="bottom">7</span></span>`,C:`<span class="math">s(a) = </span><span class="frac"><span class="top">a</span><span class="bottom">7</span></span><span class="math"> - 18</span>`,D:`<span class="math">s(a) = </span><span class="frac"><span class="top">18 - a</span><span class="bottom">7</span></span>`,k:"B",e:"Al despejar a=7s+18, se obtiene s=(a-18)/7."},
{n:31,b:"Relaciones y Algebra",q:`<p>Considere la siguiente informacion:</p><p>La funcion <span class="math">q</span>, que determina la cantidad de litros de solucion nutritiva <span class="math">q(r)</span> que hay en un deposito, esta dada por</p><p class="math">q(r)=5r+12,</p><p>donde <span class="math">r</span> representa el tiempo en horas desde que inicia el llenado del deposito, con 4 &le; r &le; 14.</p><p>De acuerdo con la informacion anterior, si se define la funcion <span class="math">r</span>, la cual corresponde a la funcion inversa de <span class="math">q</span>, entonces, &iquest;cual es el ambito de <span class="math">r</span>?</p>`,A:"[4,14]",B:"[17,82]",C:"[32,82]",D:"[32,70]",k:"A",e:"El ambito de la inversa corresponde al dominio de la funcion original: [4,14]."},
{n:32,b:"Relaciones y Algebra",q:`<p>Una plataforma de cursos registra una relacion entre cada codigo de curso y la cantidad de horas de tutoria asignadas por semana. Para que esa relacion tenga funcion inversa, &iquest;cual condicion debe cumplirse?</p>`,A:"Cada codigo de curso debe estar asociado con una unica cantidad de horas, aunque dos codigos diferentes tengan la misma cantidad.",B:"Cada cantidad de horas debe estar asociada con al menos dos codigos de curso.",C:"Cada codigo de curso debe estar asociado con una unica cantidad de horas y no debe haber dos codigos diferentes con la misma cantidad.",D:"Cada codigo de curso debe estar asociado con todas las cantidades de horas disponibles.",k:"C",e:"Para que una funcion tenga inversa como funcion, debe ser uno a uno: cada entrada tiene una sola salida y cada salida proviene de una sola entrada."},
{n:33,b:"Relaciones y Algebra",q:`<p>Considere la siguiente informacion:</p><p>En un centro de acopio se estima la cantidad maxima <span class="math">M</span> de cajas pequenas que se pueden colocar en una zona de almacenamiento. Esa cantidad esta dada por</p><p class="math">${mathImg("m_formula","M(x)=2 raiz de x mas 9 mas 6")},</p><p>donde <span class="math">x</span> representa el area disponible adicional, en metros cuadrados, con 7 &le; x &le; 72.</p><p>De acuerdo con la informacion anterior, &iquest;cual es la cantidad maxima de cajas pequenas que se pueden colocar si el area disponible adicional es de 16 m<sup>2</sup>?</p>`,A:"11",B:"14",C:"16",D:"31",k:"C",e:`Al sustituir x = 16, se obtiene ${mathImg("m_eval","M(16)=2 raiz de 25 mas 6 igual 16")}.`},
{n:34,b:"Relaciones y Algebra",q:`<p>Considere la siguiente informacion:</p><p>En una planta de tratamiento se usa un sensor para estimar la cantidad <span class="math">L</span> de litros de agua filtrada por minuto. Esa cantidad esta dada por</p><p class="math">${mathImg("l_formula","L(t)=3 raiz de t mas 4 mas 2")},</p><p>donde <span class="math">t</span> representa el tiempo de funcionamiento del filtro, en minutos, con 0 &le; t &le; 60.</p><p>De acuerdo con la informacion anterior, &iquest;cuantos minutos debe funcionar el filtro para que la cantidad estimada sea de 17 litros por minuto?</p>`,A:"9",B:"21",C:"25",D:"29",k:"B",e:`Si L(t)=17, entonces ${mathImg("l_eq","3 raiz de t mas 4 mas 2 igual 17")}, por lo que ${mathImg("l_sqrt","raiz de t mas 4 igual 5")} y t=21.`},
{n:35,b:"Relaciones y Algebra",q:`<p>Considere la siguiente informacion:</p><p>En un laboratorio escolar se registra la altura <span class="math">h(x)</span>, en centimetros, de una columna de espuma que se forma durante una reaccion. La variable <span class="math">x</span> representa el tiempo, en minutos, desde que inicia la observacion.</p><p>La siguiente representacion grafica muestra el comportamiento de esa altura:</p>${TIKZ_FIG.item28}<p>De acuerdo con la informacion anterior, &iquest;cual representacion algebraica corresponde a la funcion <span class="math">h</span>?</p>`,A:`<img class="latex-math-img" alt="h(x)=2 raiz de x menos 1 mas 3" src="data:image/svg+xml;base64,PD94bWwgdmVyc2lvbj0nMS4wJyBlbmNvZGluZz0nVVRGLTgnPz4KPCEtLSBUaGlzIGZpbGUgd2FzIGdlbmVyYXRlZCBieSBkdmlzdmdtIDMuNiAtLT4KPHN2ZyB2ZXJzaW9uPScxLjEnIHhtbG5zPSdodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZycgeG1sbnM6eGxpbms9J2h0dHA6Ly93d3cudzMub3JnLzE5OTkveGxpbmsnIHdpZHRoPScxMDAuMjkwNTE4cHQnIGhlaWdodD0nMTIuODcwMzg3cHQnIHZpZXdCb3g9Jy03MS4zNDI0NyAtNzEuNTIxODM2IDEwMC4yOTA1MTggMTIuODcwMzg3Jz4KPGRlZnM+CjxwYXRoIGlkPSdnMC0wJyBkPSdNNy44Nzg0NTYtMi43NDk2ODlDOC4wODE2OTQtMi43NDk2ODkgOC4yOTY4ODctMi43NDk2ODkgOC4yOTY4ODctMi45ODg3OTJTOC4wODE2OTQtMy4yMjc4OTUgNy44Nzg0NTYtMy4yMjc4OTVIMS40MTA3MUMxLjIwNzQ3Mi0zLjIyNzg5NSAuOTkyMjc5LTMuMjI3ODk1IC45OTIyNzktMi45ODg3OTJTMS4yMDc0NzItMi43NDk2ODkgMS40MTA3MS0yLjc0OTY4OUg3Ljg3ODQ1NlonLz4KPHBhdGggaWQ9J2cwLTExMicgZD0nTTQuNjUwNTYgMTAuMjIxNjY5TDIuNTQ2NDUxIDUuNTcxMTA4QzIuNDYyNzY1IDUuMzc5ODI2IDIuNDAyOTg5IDUuMzc5ODI2IDIuMzY3MTIzIDUuMzc5ODI2QzIuMzU1MTY4IDUuMzc5ODI2IDIuMjk1MzkyIDUuMzc5ODI2IDIuMTYzODg1IDUuNDc1NDY3TDEuMDI4MTQ0IDYuMzM2MjM5Qy44NzI3MjcgNi40NTU3OTEgLjg3MjcyNyA2LjQ5MTY1NiAuODcyNzI3IDYuNTI3NTIyQy44NzI3MjcgNi41ODcyOTggLjkwODU5MyA2LjY1OTAyOSAuOTkyMjc5IDYuNjU5MDI5QzEuMDY0MDEgNi42NTkwMjkgMS4yNjcyNDggNi40OTE2NTYgMS4zOTg3NTUgNi4zOTYwMTVDMS40NzA0ODYgNi4zMzYyMzkgMS42NDk4MTMgNi4yMDQ3MzIgMS43ODEzMiA2LjEwOTA5MUw0LjEzNjQ4OCAxMS4yODU2NzlDNC4yMjAxNzQgMTEuNDc2OTYxIDQuMjc5OTUgMTEuNDc2OTYxIDQuMzg3NTQ3IDExLjQ3Nj let idx=0,res={},flags=new Set(),remaining=180*60,timerId=null,finished=false;
function iniciar(){document.getElementById("inicio").style.display="none";document.getElementById("top").style.display="block";document.getElementById("bar").style.display="flex";document.getElementById("progress").style.display="block";document.getElementById("progressText").style.display="block";timerId=setInterval(tick,1000);show(0)}
function tick(){remaining--;if(remaining<0){finish();return}const h=String(Math.floor(remaining/3600)).padStart(2,"0"),m=String(Math.floor(remaining%3600/60)).padStart(2,"0"),s=String(remaining%60).padStart(2,"0");const t=document.getElementById("timer");t.textContent=`${h}:${m}:${s}`;if(remaining<=300)t.classList.add("low")}
function show(i){if(finished)return;idx=i;const it=ITEMS[i],total=ITEMS.length,answered=Object.keys(res).length;document.getElementById("itemLabel").textContent=`Item ${i+1} de ${total}`;document.getElementById("progressBar").style.width=(answered/total*100)+"%";document.getElementById("progressText").textContent=`${answered} de ${total} respondidos`;let opts=["A","B","C","D"].map(l=>`<button class="opt ${res[i]===l?"sel":""}" onclick="choose('${l}')" id="opt-${l}"><span class="letter">${l})</span><span class="opt-content">${it[l]}</span></button>`).join("");let select=`<select onchange="show(Number(this.value))">${ITEMS.map((x,j)=>`<option value="${j}" ${j===i?"selected":""}>Item ${j+1}${flags.has(j)?" *":""}</option>`).join("")}</select>`;document.getElementById("area").innerHTML=`<article class="card item"><div class="item-head">Item ${i+1} | ${it.b}</div><div class="stem">${it.q}</div><div class="options">${opts}</div><div class="mark"><button class="${flags.has(i)?"on":""}" onclick="toggleFlag()">${flags.has(i)?"Marcado para revisar":"Marcar para revisar"}</button></div><div class="nav"><button class="btn muted" onclick="show(${i-1})" ${i===0?"disabled":""}>Anterior</button>${select}<button class="btn primary" onclick="show(${i+1})" ${i===total-1?"disabled":""}>Siguiente</button><button class="btn danger" onclick="askFinish()">Finalizar</button></div></article>`}
function choose(l){res[idx]=l;document.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));document.getElementById("opt-"+l).classList.add("sel");document.getElementById("progressBar").style.width=(Object.keys(res).length/ITEMS.length*100)+"%";document.getElementById("progressText").textContent=`${Object.keys(res).length} de ${ITEMS.length} respondidos`}
function toggleFlag(){flags.has(idx)?flags.delete(idx):flags.add(idx);show(idx)}
function askFinish(){const miss=ITEMS.length-Object.keys(res).length;if(miss>0&&!confirm(`Tiene ${miss} item(s) sin responder. ¿Desea finalizar?`))return;finish()}
function finish(){if(finished)return;finished=true;if(timerId)clearInterval(timerId);document.getElementById("area").innerHTML="";document.getElementById("top").style.display="none";document.getElementById("bar").style.display="none";document.getElementById("progress").style.display="none";document.getElementById("progressText").style.display="none";let ok=0,bad=0,skip=0;ITEMS.forEach((it,i)=>{if(!res[i])skip++;else if(res[i]===it.k)ok++;else bad++});const pct=Math.round(ok/ITEMS.length*100);let rows=ITEMS.map((it,i)=>{let r=res[i]||"-",state=r==="-"?"Omitido":(r===it.k?"Correcto":"Incorrecto"),cls=r==="-"?"omitted":(r===it.k?"correct":"wrong");return `<tr><td>${i+1}</td><td>${r}</td><td>${it.k}</td><td class="${cls}">${state}</td><td>${it.e}</td></tr>`}).join("");document.getElementById("results").style.display="block";document.getElementById("results").innerHTML=`<h1>Resultados</h1><div class="score">${pct}%</div><div class="stats"><div class="stat ok"><strong>${ok}</strong><br>Correctas</div><div class="stat bad"><strong>${bad}</strong><br>Incorrectas</div><div class="stat skip"><strong>${skip}</strong><br>Omitidas</div></div><div class="table-wrap"><table><thead><tr><th>Item</th><th>Respuesta</th><th>Clave</th><th>Resultado</th><th>Retroalimentacion</th></tr></thead><tbody>${rows}</tbody></table></div><button class="btn primary" style="display:block;margin:18px auto 0" onclick="location.reload()">Reiniciar</button>`}
</script>
