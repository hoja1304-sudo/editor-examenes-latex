const ITEMS=[
{n:1,b:'Bloque 1 - Afirmación 1',q:`<p>En la plaza de un barrio existe una piscina comunal de forma circular.</p><p>La siguiente representación gráfica, cuyas unidades están en metros, muestra las posiciones, <em>M</em> del punto de referencia de la plaza, <em>D</em> del centro de la piscina y <em>C</em> de la circunferencia correspondiente al borde de esa piscina:</p>${FIG.i1}<p>De acuerdo con la información anterior, ¿cuál es la representación algebraica, cuyas unidades están en metros, de la circunferencia <em>C</em> que delimita esa piscina?</p>`,A:'(x - 3)<sup>2</sup> + (y - 4)<sup>2</sup> = 36',B:'(x + 4)<sup>2</sup> + (y + 3)<sup>2</sup> = 12',C:'(x - 4)<sup>2</sup> + (y - 3)<sup>2</sup> = 12',D:'(x - 4)<sup>2</sup> + (y - 3)<sup>2</sup> = 36',k:'D',e:'El centro es (4, 3) y el radio es 6; por tanto r^2 = 36.'},
{n:2,b:'Bloque 1 - Afirmación 1',q:`<p>En el jardín de una casa, se instala un aspersor de agua.</p><p>La siguiente representación gráfica, cuyas unidades están en metros, muestra las posiciones, <em>V</em> de la esquina del jardín, <em>A</em> del aspersor y <em>C</em> de la circunferencia correspondiente al alcance máximo del chorro de agua lanzado por ese aspersor en metros:</p>${FIG.i2}<p>De acuerdo con la información anterior, ¿cuál es la representación algebraica, cuyas unidades están en metros, de la circunferencia <em>C</em> correspondiente al alcance máximo del chorro de agua?</p>`,A:'(x - 2)<sup>2</sup> + (y + 3)<sup>2</sup> = 16',B:'(x + 2)<sup>2</sup> + (y - 3)<sup>2</sup> = 16',C:'(x + 2)<sup>2</sup> + (y - 3)<sup>2</sup> = 8',D:'(x + 2)<sup>2</sup> + (y + 3)<sup>2</sup> = 16',k:'B',e:'El centro es (-2, 3) y el radio es 4; por tanto la ecuación es (x + 2)^2 + (y - 3)^2 = 16.'},
{n:3,b:'Bloque 1 - Afirmación 1',q:`<p>Una empresa instala un enrutador de Wi-Fi en el punto <em>E</em> del plano de la oficina, donde las unidades están en metros. El enrutador emite una señal de 10 metros a la redonda.</p><p>Cuatro computadoras están ubicadas en los puntos P(11, 2), Q(3, 14), R(-3, 9) y S(8, 9).</p><p>La siguiente representación gráfica muestra la ubicación del enrutador y la circunferencia correspondiente al alcance máximo de la señal:</p>${FIG.i3}<p>De acuerdo con la información anterior, ¿cuál de esas computadoras se debe reubicar para que tenga señal Wi-Fi del enrutador?</p>`,A:'Q',B:'S',C:'P',D:'R',k:'A',e:'Q está a 12 metros del centro E(3, 2), distancia mayor que el radio 10.'},
{n:4,b:'Bloque 1 - Afirmación 1',q:`<p>Una empresa de telecomunicaciones modela el alcance de la señal de una antena con la siguiente representación algebraica, donde las unidades están en kilómetros:</p><p class="eq">(x + 3)<sup>2</sup> + (y - 4)<sup>2</sup> = 9</p><p>¿Cuál de las siguientes representaciones gráficas corresponde a esa circunferencia?</p>`,A:FIG.i04A,B:FIG.i04B,C:FIG.i04C,D:FIG.i04D,k:'C',e:'La ecuación tiene centro (-3, 4) y radio 3.'},
{n:5,b:'Bloque 1 - Afirmación 2',q:`<p>Un sistema de alarma instalado en una bodega emite una señal sonora circular. El alcance máximo de esa señal se modela mediante la circunferencia C<sub>1</sub> con la ecuación:</p><p class="eq">(x + 4)<sup>2</sup> + (y - 2)<sup>2</sup> = 9</p><p>donde las unidades están en metros.</p><p>Por razones de mantenimiento, el equipo se traslada 7 metros hacia el este y 3 metros hacia el sur.</p><p>De acuerdo con la información anterior, ¿cuál es la ecuación de la circunferencia C<sub>2</sub> que representa el nuevo alcance de la señal sonora?</p>`,A:'(x - 3)<sup>2</sup> + (y + 1)<sup>2</sup> = 9',B:'(x + 3)<sup>2</sup> + (y - 1)<sup>2</sup> = 9',C:'(x + 11)<sup>2</sup> + (y - 5)<sup>2</sup> = 9',D:'(x - 3)<sup>2</sup> + (y + 1)<sup>2</sup> = 3',k:'A',e:'El centro inicial es (-4, 2). Al trasladarlo 7 al este y 3 al sur queda en (3, -1), con el mismo radio.'},
{n:6,b:'Bloque 1 - Afirmación 2',q:`<p>Un teléfono celular que emite una señal inalámbrica circular se ubica en el punto <em>T</em> de un dormitorio.</p><p>La siguiente representación gráfica, cuyas unidades están en metros, muestra las ubicaciones <em>T</em> del teléfono y <em>C</em> de la circunferencia correspondiente al alcance máximo de la señal emitida:</p>${FIG.i6}<p>De acuerdo con la información anterior, si ese teléfono se traslada 4 metros hacia la izquierda y 5 metros hacia el sur, ¿cuál es la representación algebraica, cuyas unidades están en metros, de la circunferencia correspondiente al alcance máximo de la señal en su nueva ubicación?</p>`,A:'(x - 2)<sup>2</sup> + y<sup>2</sup> = 9',B:'(x + 2)<sup>2</sup> + y<sup>2</sup> = 9',C:'(x + 2)<sup>2</sup> + y<sup>2</sup> = 3',D:'(x + 2)<sup>2</sup> + (y - 5)<sup>2</sup> = 9',k:'B',e:'El centro pasa de (2, 5) a (-2, 0), y el radio sigue siendo 3.'},
{n:7,b:'Bloque 1 - Afirmación 2',q:`<p>Un aspersor de riego instalado en un terreno cubre un área circular cuyo alcance máximo se modela mediante la circunferencia C<sub>1</sub> con ecuación:</p><p class="eq">(x - 5)<sup>2</sup> + (y + 3)<sup>2</sup> = 16</p><p>donde las unidades están en metros.</p><p>Debido a una remodelación del terreno, el aspersor se reubica 3 metros hacia el oeste y 6 metros hacia el norte.</p><p>De acuerdo con la información anterior, ¿cuál de las siguientes representaciones gráficas, cuyas unidades están en metros, corresponde al alcance del aspersor en su nueva ubicación?</p>`,A:FIG.i07A,B:FIG.i07B,C:FIG.i07C,D:FIG.i07D,k:'D',e:'El centro inicial es (5, -3). La traslación lo lleva a (2, 3), con radio 4.'},
{n:8,b:'Bloque 1 - Afirmación 3',q:`<p>En una feria científica se coloca un sensor circular sobre una mesa para detectar la posición final de pequeñas fichas metálicas. El borde de la zona de detección se representa mediante una circunferencia <em>C</em> de centro <em>O</em>.</p><p>La figura muestra, en centímetros, la circunferencia <em>C</em> y su centro <em>O</em>:</p>${FIG.i8}<p>Durante una prueba, cuatro fichas identificadas como R, S, W y T quedaron ubicadas, respectivamente, en los puntos (9, 7), (4, 5), (10, 9) y (7, 2).</p><p>De acuerdo con la información anterior, ¿cuál de esas fichas quedó ubicada en el exterior de la zona de detección?</p>`,A:'R',B:'S',C:'T',D:'W',k:'D',e:'El centro es (7, 5) y el radio es 3. Para W(10, 9), la distancia al centro es 5, mayor que 3.'},
{n:9,b:'Bloque 1 - Afirmación 3',q:`<p>Considere la siguiente información:</p><p>La siguiente figura representa dos zonas circulares de jardinería, C<sub>1</sub> de centro <em>O</em> y radio 5, y C<sub>2</sub> de centro <em>P</em> y radio 3, además de la recta <em>m</em>, en un sistema de coordenadas:</p>${FIG.i9}<p>De acuerdo con la información de la figura anterior, considere las siguientes proposiciones:</p><p>I. El eje <em>x</em> es tangente a C<sub>1</sub> y a C<sub>2</sub>.</p><p>II. La recta <em>m</em> es secante a C<sub>1</sub> y tangente a C<sub>2</sub>.</p><p>De ellas, ¿cuál o cuáles son verdaderas?</p>`,A:'Ambas.',B:'Ninguna.',C:'Solo la I.',D:'Solo la II.',k:'A',e:'El eje x toca cada circunferencia en un solo punto; la recta m corta a C1 en dos puntos y toca a C2 en D.'},
{n:10,b:'Bloque 1 - Afirmación 3',q:`<p>Considere la siguiente representación gráfica, en la cual la circunferencia <em>C</em> de centro <em>M</em> y la circunferencia <em>P</em> de centro <em>H</em> son tangentes en el punto <em>B</em>, y el eje <em>x</em> es tangente a <em>C</em> en el punto <em>A</em>:</p>${FIG.i10}<p>De acuerdo con la información anterior, si AH = 48 y MH = 50, entonces, ¿cuál es la medida del radio de P?</p>`,A:'14',B:'36',C:'50',D:'64',k:'B',e:'Como el radio de C es AM y AH es tangente, AM^2 + AH^2 = MH^2. Entonces AM = 14. Por tangencia externa, el radio de P es 50 - 14 = 36.'},
{n:11,b:'Bloque 1 - Afirmación 3',q:`<p>La gráfica adjunta representa un camino <em>m</em> construido en un terreno cuyas unidades están en kilómetros:</p>${FIG.i11}<p>Si se desea crear un camino perpendicular al camino <em>m</em> representado por 3y = kx - 6, entonces, ¿cuál es el valor de k?</p>`,A:'4',B:'<span style="display:inline-block;text-align:center"><span style="border-bottom:1px solid #111;display:block">3</span><span>4</span></span>',C:'-4',D:'<span style="display:inline-block;text-align:center"><span style="border-bottom:1px solid #111;display:block">-3</span><span>4</span></span>',k:'A',e:'La pendiente de m es -3/4. Una recta perpendicular debe tener pendiente 4/3. En 3y = kx - 6, la pendiente es k/3; por tanto k/3 = 4/3 y k = 4.'},
{n:12,b:'Bloque 1 - Afirmación 4',q:`<p>A continuación, se muestra la representación gráfica, cuyas unidades están en metros, del piso de una casa:</p>${FIG.i12}<p>De acuerdo con la información anterior, si se le quiere colocar cerámica a la totalidad del piso de esa casa, entonces, ¿cuántos metros cuadrados de cerámica, como mínimo, se deben comprar?</p>`,A:'80',B:'88',C:'96',D:'104',k:'B',e:'El rectángulo de 12 m por 8 m tiene 96 m². Se descuenta el triángulo rectángulo de catetos 4 m y 4 m, cuya área es 8 m²; por tanto se requieren 88 m².'},
{n:13,b:'Bloque 1 - Afirmación 4',q:`<p>En un centro recreativo se construirán dos plazoletas. La primera tendrá forma de dodecágono regular y la segunda forma de octágono regular.</p><p>La medida del lado del dodecágono debe ser el doble de la medida del lado del octágono.</p><p>Si el perímetro de la plazoleta con forma de dodecágono debe ser 96 m, entonces, ¿cuál será el perímetro de la plazoleta con forma de octágono?</p>`,A:'32 m',B:'48 m',C:'64 m',D:'96 m',k:'A',e:'El lado del dodecágono mide 96/12 = 8 m. El lado del octágono mide la mitad, 4 m; por tanto su perímetro es 8 × 4 = 32 m.'},
{n:14,b:'Bloque 1 - Afirmación 4',q:`<p>La siguiente representación gráfica muestra la superficie de una pieza decorativa que se colocará sobre una pared:</p><div style="border:1px solid #111;display:block;width:max-content;max-width:100%;margin:8px auto;padding:6px 12px;text-align:center">La medida del lado de cada cuadrado de la cuadrícula es 10 cm.</div>${FIG.i14}<p>De acuerdo con la información anterior, si se requiere colocar una cinta adhesiva alrededor de todo el borde de esa pieza decorativa, entonces, ¿cuál es la cantidad mínima aproximada de centímetros de cinta que se requiere?</p>`,A:'140',B:'156',C:'180',D:'200',k:'B',e:'El borde mide aproximadamente 5 + 2 + √20 + √17 unidades de cuadrícula, es decir, cerca de 15,6 unidades. Como cada unidad mide 10 cm, se requieren cerca de 156 cm.'},
{n:15,b:'Bloque 1 - Afirmación 4',q:`<p>Una carpintera diseñó una puerta decorativa como la que se muestra en la siguiente representación gráfica:</p><div style="border:1px solid #111;display:block;width:max-content;max-width:100%;margin:8px auto;padding:6px 12px;text-align:center">La medida del lado de cada cuadrado de la cuadrícula es 1 m.</div>${FIG.i15}<p>De acuerdo con la información anterior, el perímetro, en metros, de esa puerta decorativa es</p>`,A:'mayor que 12, pero menor que 13.',B:'mayor que 14, pero menor que 15.',C:'mayor que 15, pero menor que 16.',D:'mayor que 10, pero menor que 12.',k:'B',e:'El perímetro es 4 + 2 + 2 + 2π, aproximadamente 14,28 m, por lo que es mayor que 14 y menor que 15.'},
{n:16,b:'Bloque 1 - Afirmación 5',q:`<p>Una empresa fabrica recipientes decorativos a partir de esferas de vidrio. A una esfera se le realiza un corte plano para obtener la abertura circular de uno de esos recipientes. La medida del radio de la esfera es 13 cm. Además, al momento de realizar ese corte, el centro de la abertura queda a 5 cm del centro de la esfera. ¿Cuál es la medida del radio de la abertura de ese recipiente?</p>`,A:'8 cm',B:'12 cm',C:'13 cm',D:'18 cm',k:'B',e:'Se forma un triángulo rectángulo con hipotenusa 13 cm y un cateto 5 cm; el radio de la abertura es √(13² - 5²) = 12 cm.'},
{n:17,b:'Bloque 1 - Afirmación 5',q:`<p>La medida del radio de un tanque cilíndrico circular recto es de 6 cm y la medida de su altura es el doble de la medida de su radio. Si a ese cilindro se le realiza un corte con un plano perpendicular a sus bases y que pasa por el centro de las bases, entonces, ¿cuál es el área, en centímetros cuadrados, de la sección plana que se obtiene de la intersección del cilindro y el plano?</p>`,A:'72',B:'144',C:'36',D:'288',k:'B',e:'La altura es 12 cm y el diámetro es 12 cm; la sección rectangular mide 12 cm por 12 cm, por lo que el área es 144 cm².'},
{n:18,b:'Bloque 1 - Afirmación 5',q:`<p>Considere la siguiente información:</p><p>Una empresa fabrica vasos para lo cual utiliza conos circulares rectos, a los que se les hace un corte con un plano paralelo a la base del cono, como se muestra en la figura:</p>${FIG.i18}<p>De acuerdo con los datos de la información anterior, si el vaso corresponde a la figura destacada con gris y la medida del radio de la base del vaso es 2,5 cm, entonces, ¿cuál es la medida de la altura del cono que da origen a esos vasos?</p>`,A:'20',B:'28',C:'11,2',D:'12,4',k:'D',e:'Por semejanza, (H - 8) / H = 2,5 / 7. Entonces 7H - 56 = 2,5H, de donde 4,5H = 56 y H ≈ 12,4 cm.'},
{n:19,b:'Bloque 1 - Afirmación 6',q:`<p>En una institución educativa se diseñó una pieza decorativa para colocarla en la entrada del gimnasio. La siguiente figura representa la forma de esa pieza y algunas rectas trazadas sobre ella:</p>${FIG.i19}<p>De acuerdo con la información anterior, ¿cuál de esas rectas corresponde a un eje de simetría de la pieza decorativa?</p>`,A:'<em>h</em>',B:'<em>j</em>',C:'<em>k</em>',D:'<em>n</em>',k:'A',e:'La recta <em>h</em> es el eje de simetría vertical de la pieza; divide la figura en dos partes congruentes que se corresponden por reflexión.'},
{n:20,b:'Bloque 1 - Afirmación 6',q:`<p>En el diseño de un parque se desea ubicar dos postes de iluminación de manera simétrica con respecto a un sendero rectilíneo. En el plano, el sendero está representado por la recta <em>r</em>, y el poste <em>P</em> está ubicado como se muestra en la siguiente representación gráfica, cuyas unidades están en metros:</p>${FIG.i20}<p>Si el poste <em>Q</em> debe ubicarse en el punto simétrico de <em>P</em> con respecto a la recta <em>r</em>, entonces ¿cuáles son las coordenadas de <em>Q</em>?</p>`,A:'(4, 3)',B:'(6, 3)',C:'(8, 3)',D:'(10, 3)',k:'D',e:'La recta <em>r</em> corresponde a <em>x</em> = 6. El punto P(2, 3) está a 4 unidades a la izquierda de <em>r</em>, por lo que su simétrico debe estar 4 unidades a la derecha: Q(10, 3).'},
{n:21,b:'Bloque 1 - Afirmación 7',q:`<p>En el plano de diseño de una institución educativa, el polígono <em>ABCD</em> representa la forma de una zona verde que será reproducida en diferentes posiciones del patio.</p>${FIG.i21}<p>Si al polígono <em>ABCD</em> se le aplica una reflexión respecto a la recta dada por <em>y</em> = −<em>x</em>, entonces, ¿cuál es la imagen del punto <em>A</em>?</p>`,A:'(−2, −6)',B:'(6, −2)',C:'(−6, 2)',D:'(2, 6)',k:'C',e:'La reflexión respecto a y = −x transforma (x, y) en (−y, −x). Por tanto, A(−2, 6) se transforma en (−6, 2).'},
{n:22,b:'Bloque 1 - Afirmación 7',q:`<p>Considere la siguiente figura.</p>${FIG.i22}<p>De acuerdo con los datos de la figura, el cuadrilátero <em>EFGH</em> con respecto al cuadrilátero <em>ABCD</em> presenta una homotecia de razón</p>`,A:'<em>k</em> = 2',B:'<em>k</em> = 6',C:'<em>k</em> = ½',D:'<em>k</em> = ⅓',k:'A',e:'La homotecia con centro en P(0, 0) y razón k = 2 transforma ABCD en EFGH: 2×A(6, 0) = E(12, 0), 2×B(5, 2) = F(10, 4), 2×C(7, 3) = G(14, 6), 2×D(9, 0) = H(18, 0).'},
{n:23,b:'Bloque 1 - Afirmación 7',q:`<p>En una aplicación de mapas, la ubicación de una cámara de seguridad se representa por el punto <em>P</em>(3, −2) en un plano cartesiano. Para ajustar la orientación del mapa en la pantalla, el sistema aplica una rotación de 90° en sentido antihorario alrededor del origen.</p><p>¿Cuáles son las coordenadas del punto que representa la nueva ubicación de la cámara en la pantalla?</p>`,A:'(−2, −3)',B:'(2, 3)',C:'(−3, 2)',D:'(3, 2)',k:'B',e:'Una rotación de 90° antihorario transforma (x, y) en (−y, x). Por tanto, P(3, −2) se transforma en (2, 3).'},
{n:24,b:'Bloque 2 - Afirmación 1',q:`<p>La cantidad "<em>D</em>" de descargas diarias de una aplicación deportiva, en miles, está dada por:</p><p style="text-align:center"><em>D</em>(<em>t</em>) = 250<em>t</em>³ + 500</p><p>donde "<em>t</em>" representa el tiempo en semanas transcurridas desde su lanzamiento, con 0 &lt; <em>t</em> ≤ 10. ¿Cuántas semanas después de su lanzamiento la aplicación alcanzó las 54 500 miles de descargas diarias?</p>`,A:'4',B:'5',C:'7',D:'6',k:'D',e:'D(6) = 250 × 6³ + 500 = 250 × 216 + 500 = 54 000 + 500 = 54 500 ✓'},
{n:25,b:'Bloque 2 - Afirmación 1',q:`<p>La función <em>h</em>, que determina el ingreso mensual en colones <em>h</em>(<em>n</em>) obtenido en un taller de reparaciones por atender "<em>n</em>" clientes, está dada por <em>h</em>(<em>n</em>) = 15 000<em>n</em>, con 0 &lt; <em>n</em> ≤ 200. Asimismo, la función <em>n</em>, que determina la cantidad mensual <em>n</em>(<em>m</em>) de clientes atendidos en ese taller, está dada por <em>n</em>(<em>m</em>) = 4<em>m</em> + 2, donde "<em>m</em>" representa el tiempo en meses desde que el taller inició operaciones, con 1 &lt; <em>m</em> ≤ 12.</p><p>De acuerdo con la información anterior, si en ese taller se requiere conocer el contenido de la función (<em>h</em> ∘ <em>n</em>) que determina el ingreso mensual en colones en función del tiempo "<em>m</em>", entonces, ¿cuál es el criterio de (<em>h</em> ∘ <em>n</em>)?</p>`,A:'(<em>h</em> ∘ <em>n</em>)(<em>m</em>) = 60 000<em>m</em>',B:'(<em>h</em> ∘ <em>n</em>)(<em>m</em>) = 60 000<em>m</em> + 2',C:'(<em>h</em> ∘ <em>n</em>)(<em>m</em>) = 60 000<em>m</em> + 30 000',D:'(<em>h</em> ∘ <em>n</em>)(<em>m</em>) = 4<em>m</em> + 17 000',k:'C',e:'(h∘n)(m) = h(n(m)) = h(4m+2) = 15 000(4m+2) = 60 000m + 30 000.'},
{n:26,b:'Bloque 2 - Afirmación 1',q:`<p>La siguiente representación gráfica corresponde a la temperatura <em>T</em>(<em>h</em>) en grados Celsius al interior de un invernadero de plantas, en función de las horas del día "<em>h</em>", con 6 &lt; <em>h</em> ≤ 18.</p>${FIG.i26}<p>En ese día, la temperatura al interior del invernadero disminuyó entre las</p>`,A:'6h y 10h',B:'10h y 14h',C:'14h y 18h',D:'6h y 18h',k:'B',e:'La gráfica muestra que T(h) desciende de 25 °C a 10 °C entre h = 10 y h = 14. En los intervalos 6-10 y 14-18 la función es creciente.'},
{n:27,b:'Bloque 2 - Afirmación 1',q:`<p>Considere las siguientes representaciones de dos relaciones:</p>${FIG.i27}<p>De acuerdo con la información anterior, ¿cuál o cuáles representaciones pueden corresponder a una función?</p>`,A:'Solo la II',B:'Solo la I',C:'Ninguna',D:'Ambas',k:'B',e:'La representación I es función: cada x tiene exactamente un valor de g(x). La representación II no es función: en x = 3 la relación asigna dos valores (y = 5 e y = 2).'},
{n:28,b:'Bloque 2 - Afirmación 1',q:`<p>La siguiente representación gráfica corresponde al costo de envío <em>C</em>(<em>p</em>) en colones que cobra un servicio de mensajería, en función de la masa <em>p</em> en kilogramos del paquete a enviar.</p>${FIG.i28}<p>De acuerdo con la información anterior, si se enviará un paquete con masa de 6 kg, ¿cuál es el costo de envío que se deberá pagar?</p>`,A:'900 colones',B:'1 800 colones',C:'3 000 colones',D:'5 000 colones',k:'B',e:'Para 3 &lt; p ≤ 6 el costo es 1 800 colones. El extremo p = 6 es cerrado (punto sólido), por lo tanto C(6) = 1 800 colones.'},
{n:29,b:'Bloque 2 - Afirmación 2',q:`<p>Una empresa de servicios eléctricos establece que la función <em>f</em>, que determina la tensión <em>f</em>(<em>t</em>) en voltios (V) en la red eléctrica de un edificio, está dada por <em>f</em>(<em>t</em>) = 2<em>t</em> + 2, con 0 ≤ <em>t</em> ≤ 3. La siguiente figura muestra cuatro representaciones gráficas. ¿Cuál corresponde a la gráfica de <em>f</em><sup>−1</sup>?</p>${FIG.i29}`,A:'Gráfica A',B:'Gráfica B',C:'Gráfica C',D:'Gráfica D',k:'B',e:'La inversa <em>f</em><sup>−1</sup> intercambia el dominio [0,&nbsp;3] y el rango [2,&nbsp;8] de <em>f</em>. Por tanto, <em>f</em><sup>−1</sup> tiene dominio [2,&nbsp;8] y rango [0,&nbsp;3], con el mismo sentido de variación (creciente). Solo la gráfica B va de (2,&nbsp;0) a (8,&nbsp;3).'},
{n:30,b:'Bloque 2 - Afirmación 2',q:`<p>La siguiente representación gráfica corresponde a la función <em>g</em>, que determina la ganancia <em>g</em>(<em>x</em>) en millones de colones de una empresa artesanal, en función de la cantidad <em>x</em> (en cientos) de artículos producidos, con 0 &lt; <em>x</em> &lt; 6.</p>${FIG.i30}<p>¿Cuál es un intervalo donde la función <em>g</em> tiene función inversa?</p>`,A:'[0,  6]',B:'[1,  4]',C:'[2,  5]',D:'[4,  6]',k:'D',e:'Una función tiene inversa en un intervalo cuando es monótona en ese intervalo. La gráfica muestra que <em>g</em> tiene vértice en <em>x</em> = 3. Los intervalos [0,6], [1,4] y [2,5] contienen el vértice, por lo que la función no es monótona en ellos. En [4,&nbsp;6] la función es estrictamente decreciente → tiene inversa.'},
{n:31,b:'Bloque 2 - Afirmación 2',q:`<p>Una distribuidora de productos alimentarios establece que la función <em>c</em>, la cual determina el costo total <em>c</em>(<em>p</em>) en colones de un pedido, está dada por <em>c</em>(<em>p</em>) = 200<em>p</em> + 400, donde “<em>p</em>” representa la cantidad de productos solicitados, con 5 ≤ <em>p</em> ≤ 20.</p><p>De acuerdo con la información anterior, si para verificar la cantidad de productos en un pedido a partir de su costo total se requiere determinar el criterio de la función <em>p</em>, la cual corresponde a la función inversa de <em>c</em>, entonces, ¿cuál opción corresponde a ese criterio?</p>`,A:FIG.i31A,B:FIG.i31B,C:FIG.i31C,D:FIG.i31D,k:'C',e:'De <em>c</em> = 200<em>p</em> + 400 se despeja: <em>p</em> = <span class="fr"><span class="n"><em>c</em> − 400</span><span class="d">200</span></span>.'},
{n:32,b:'Bloque 2 - Afirmación 2',q:`<p>En una empresa constructora se establece que la función <em>a</em>, la cual determina el área <em>a</em>(<em>s</em>) en metros cuadrados de la sección transversal de una viga de concreto, está dada por <em>a</em>(<em>s</em>) = 5<em>s</em><sup>2</sup> + 20, donde “<em>s</em>” representa la longitud del lado en metros, con 2 ≤ <em>s</em> ≤ 8.</p><p>De acuerdo con la información anterior, si para determinar la longitud del lado de la sección a partir de su área se requiere conocer el criterio de la función <em>s</em>, la cual corresponde a la función inversa de <em>a</em>, entonces, ¿cuál opción corresponde a ese criterio?</p>`,A:FIG.i32A,B:FIG.i32B,C:FIG.i32C,D:FIG.i32D,k:'C',e:'De <em>a</em> = 5<em>s</em><sup>2</sup> + 20 se despeja: <em>s</em><sup>2</sup> = <span class="fr"><span class="n"><em>a</em> − 20</span><span class="d">5</span></span> = <span class="fr"><span class="n"><em>a</em></span><span class="d">5</span></span> − 4, por lo que <em>s</em> = <span class="sq"><span class="rad"><span class="fr"><span class="n"><em>a</em></span><span class="d">5</span></span> − 4</span></span>.'},
{n:33,b:'Bloque 2 - Afirmación 3',
  q:`<p>En una comunidad se utiliza una turbina eólica para generar electricidad. La potencia <em>P</em>(<em>v</em>), en kilovatios, que produce la turbina está dada por ${FIG.i33f}, donde "<em>v</em>" representa la velocidad del viento en m/s, con 1 ≤ <em>v</em> ≤ 26.</p><p>De acuerdo con la información anterior, si la turbina produce 12 kilovatios, ¿cuál es la velocidad del viento en m/s?</p>`,
  A:'13', B:'15', C:'17', D:'19', r:'C',
  e:'Si P(v) = 12, entonces 2√(v−1) + 4 = 12, de donde 2√(v−1) = 8, √(v−1) = 4, v−1 = 16, por lo que v = 17 m/s.'},
{n:34,b:'Bloque 2 - Afirmación 3',
  q:`<p>En un experimento de laboratorio se registra la temperatura <em>T</em>(<em>t</em>), en grados Celsius, de una muestra metálica al enfriarse en agua. Dicha temperatura está dada por ${FIG.i34f}, donde "<em>t</em>" representa el tiempo en segundos transcurridos, con 0 &lt; <em>t</em> ≤ 100.</p><p>De acuerdo con la información anterior, conforme avanza el tiempo de enfriamiento, la temperatura de la muestra</p>`,
  A:'aumenta', B:'disminuye', C:'se mantiene constante', D:'aumenta y luego disminuye', r:'B',
  e:'T(t) = −5√t + 50. Como √t aumenta cuando t aumenta, el término −5√t disminuye, por lo que T(t) disminuye conforme avanza el tiempo.'},
{n:35,b:'Bloque 2 - Afirmación 3',
  q:`<p>La siguiente representación gráfica corresponde a la función <em>g</em>, la cual determina la producción <em>g</em>(<em>x</em>) en cientos de unidades de una empresa artesanal, en función de la cantidad <em>x</em> de empleados disponibles, con 4 ≤ <em>x</em> ≤ 13.</p>${FIG.i35}<p>De acuerdo con la información anterior, ¿cuál de las siguientes opciones corresponde al criterio de la función <em>g</em>?</p>`,
  A:FIG.i35A, B:FIG.i35B, C:FIG.i35C, D:FIG.i35D, r:'C',
  e:'El punto (5, 1) satisface g(x) = √(x − 4): g(5) = √(5 − 4) = √1 = 1. Además g(4) = 0, lo que confirma que la función comienza en (4, 0). Por lo tanto, g(x) = √(x − 4).'}
];
let idx=0,res={},flags=new Set(),finished=false,timerId=null,remaining=5760;
function iniciar(){document.getElementById('inicio').style.display='none';['top','bar','progress','progressText'].forEach(id=>{const el=document.getElementById(id);el.style.display=id==='bar'?'flex':'block'});timerId=setInterval(tick,1000);show(0)}
function tick(){remaining--;if(remaining<0){finish();return}const h=String(Math.floor(remaining/3600)).padStart(2,'0'),m=String(Math.floor(remaining%3600/60)).padStart(2,'0'),s=String(remaining%60).padStart(2,'0'),t=document.getElementById('timer');t.textContent=`${h}:${m}:${s}`;if(remaining<=60)t.classList.add('low')}
function show(i){if(finished)return;idx=i;const it=ITEMS[i],total=ITEMS.length,answered=Object.keys(res).length;document.getElementById('itemLabel').textContent=`Ítem ${i+1} de ${total}`;document.getElementById('progressBar').style.width=answered/total*100+'%';document.getElementById('progressText').textContent=`${answered} de ${total} respondidos`;const opts=['A','B','C','D'].map(l=>`<button class="opt ${res[i]===l?'sel':''}" onclick="choose('${l}')" id="opt-${l}"><span class="letter">${l})</span><span class="opt-content">${it[l]}</span></button>`).join('');const sel=ITEMS.map((x,j)=>`<option value="${j}" ${j===i?'selected':''}>Ítem ${j+1}${flags.has(j)?' *':''}</option>`).join('');document.getElementById('area').innerHTML=`<article class="card item"><div class="item-head">Ítem ${i+1} | ${it.b}</div><div class="stem">${it.q}</div><div class="options">${opts}</div><div class="mark"><button class="${flags.has(i)?'on':''}" onclick="toggleFlag()">${flags.has(i)?'Marcado':'Marcar para revisar'}</button></div><div class="nav"><button class="btn muted" onclick="show(${i-1})" ${i===0?'disabled':''}>Anterior</button><select onchange="show(Number(this.value))">${sel}</select><button class="btn primary" onclick="show(${i+1})" ${i===total-1?'disabled':''}>Siguiente</button><button class="btn danger" onclick="askFinish()">Finalizar</button></div></article>`}
function choose(l){res[idx]=l;document.querySelectorAll('.opt').forEach(b=>b.classList.remove('sel'));document.getElementById('opt-'+l).classList.add('sel');const answered=Object.keys(res).length;document.getElementById('progressBar').style.width=answered/ITEMS.length*100+'%';document.getElementById('progressText').textContent=`${answered} de ${ITEMS.length} respondidos`}
function toggleFlag(){flags.has(idx)?flags.delete(idx):flags.add(idx);show(idx)}
function askFinish(){const miss=ITEMS.length-Object.keys(res).length;if(miss>0&&!confirm(`Tiene ${miss} item(s) sin responder. ¿Desea finalizar de todos modos?`))return;finish()}
function finish(){if(finished)return;finished=true;if(timerId)clearInterval(timerId);document.getElementById('area').innerHTML='';['top','bar','progress','progressText'].forEach(id=>document.getElementById(id).style.display='none');let ok=0,bad=0,skip=0;ITEMS.forEach((it,i)=>{if(!res[i])skip++;else if(res[i]===it.k)ok++;else bad++});const pct=Math.round(ok/ITEMS.length*100);const rows=ITEMS.map((it,i)=>{const r=res[i]||'-',state=r==='-'?'Omitido':(r===it.k?'Correcto':'Incorrecto'),cls=r==='-'?'omitted':(r===it.k?'correct':'wrong');return `<tr><td>${i+1}</td><td>${r}</td><td>${it.k}</td><td class="${cls}">${state}</td><td style="text-align:left;font-size:.85rem">${it.e}</td></tr>`}).join('');document.getElementById('results').style.display='block';document.getElementById('results').innerHTML=`<h1>Resultados</h1><div class="score">${pct}%</div><div class="stats"><div class="stat ok"><strong>${ok}</strong><br>Correctas</div><div class="stat bad"><strong>${bad}</strong><br>Incorrectas</div><div class="stat skip"><strong>${skip}</strong><br>Omitidas</div></div><div class="table-wrap"><table class="res"><thead><tr><th>Ítem</th><th>Respuesta</th><th>Clave</th><th>Resultado</th><th>Retroalimentación</th></tr></thead><tbody>${rows}</tbody></table></div><button class="btn primary" style="display:block;margin:18px auto 0" onclick="location.reload()">Reiniciar</button>`}
</script>
</body>
</html>
