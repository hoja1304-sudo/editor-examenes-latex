*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f6fb;color:#202124;line-height:1.55}.wrap{width:min(100%,900px);margin:auto;padding:18px}.card{background:white;border:1px solid #d9dee8;border-radius:8px;box-shadow:0 2px 10px rgba(22,34,51,.08)}.inicio{padding:34px;text-align:center;margin-top:28px}h1{margin:0 0 8px;color:#15246b;font-size:1.55rem}h2{margin:0;color:#334}.sub{color:#596579;margin:10px 0 24px}.btn{border:0;border-radius:6px;padding:10px 16px;font-weight:700;cursor:pointer;font-size:1rem}.primary{background:#1565c0;color:white}.primary:hover{background:#0d47a1}.muted{background:#e8ecf3;color:#253044}.danger{background:#b42318;color:white}.top{display:none;background:#172b85;color:white;border-radius:8px 8px 0 0;padding:12px 18px}.top h1{color:white;font-size:1.05rem}.bar{display:none;align-items:center;justify-content:space-between;gap:10px;background:#243c9b;color:white;border-radius:0 0 8px 8px;padding:8px 18px;margin-bottom:14px;font-size:.92rem}.timer{font-weight:800;letter-spacing:.04em}.timer.low{color:#ffd2d2}.progress{display:none;height:8px;background:#dce3ef;border-radius:999px;overflow:hidden;margin-bottom:8px}.progress span{display:block;height:100%;width:0;background:#1565c0;transition:width .2s}.progress-text{display:none;text-align:right;color:#596579;font-size:.88rem;margin-bottom:12px}.item{padding:20px}.item-head{font-weight:800;color:#15246b;margin-bottom:12px}.stem p{margin:0 0 10px}.math{font-family:"Times New Roman",serif}.fig{display:block;margin:12px auto;max-width:100%;height:auto}.fig text{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#111}.options{display:flex;flex-direction:column;gap:9px;margin-top:14px}.opt{display:flex;gap:10px;align-items:flex-start;width:100%;padding:11px 13px;background:#fbfcff;border:1.5px solid #c8d0dc;border-radius:6px;text-align:left;cursor:pointer;font-size:1rem}.opt:hover:not(:disabled){background:#eef4ff;border-color:#5f7ecf}.opt.sel{background:#e8f1ff;border-color:#1565c0}.letter{font-weight:800;min-width:24px}.mark{margin-top:12px}.mark button{background:#fff8e1;border:1px solid #e0a800;border-radius:5px;padding:5px 10px;color:#7b5900;cursor:pointer}.mark button.on{background:#ffecb3}.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px}select{padding:8px;border:1px solid #9aa4b2;border-radius:5px}.results{display:none;padding:26px}.score{text-align:center;color:#15246b;font-size:2.35rem;font-weight:800;margin:12px}.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:18px}.stat{min-width:112px;text-align:center;border-radius:8px;padding:12px}.ok{background:#e7f6ec;color:#176b36}.bad{background:#feeceb;color:#b42318}.skip{background:#fff6dc;color:#8a6100}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px;font-size:.92rem}th{background:#e8ecff;color:#1f2b61}th,td{border:1px solid #d9dee8;padding:7px;text-align:center}.correct{color:#176b36;font-weight:800}.wrong{color:#b42318;font-weight:800}.omitted{color:#8a6100;font-weight:800}.mini-grid{display:grid;grid-template-columns:repeat(2,minmax(210px,1fr));gap:10px;margin-top:8px}.mini-option{border:1px solid #d6dbe5;border-radius:6px;padding:8px;background:#fafbff}.smallfig{width:190px;height:132px}.note{font-size:.92rem;color:#596579}.hidden{display:none}@media(max-width:720px){.wrap{padding:12px}.inicio,.item,.results{padding:18px}.bar{align-items:flex-start;flex-direction:column}.nav .btn,.nav select{width:100%}.mini-grid{grid-template-columns:1fr}.smallfig{width:100%;height:auto}}

<script>
function svgCircle(cx,cy,r,opts={}){
  const x0=opts.x0??0,y0=opts.y0??0,xMax=opts.xMax??28,yMax=opts.yMax??22,xMin=opts.xMin??-4,yMin=opts.yMin??-4;
  const w=360,h=250,p=32,sx=x=>p+(x-xMin)/(xMax-xMin)*(w-2*p),sy=y=>h-p-(y-yMin)/(yMax-yMin)*(h-2*p);
  const labels=opts.labels||[];
  return `<svg class="fig" viewBox="0 0 ${w} ${h}" role="img" aria-label="grafico cartesiano">
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#111"/></marker></defs>
  <line x1="${sx(xMin)}" y1="${sy(0)}" x2="${sx(xMax)}" y2="${sy(0)}" stroke="#111" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="${sx(0)}" y1="${sy(yMin)}" x2="${sx(0)}" y2="${sy(yMax)}" stroke="#111" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="${sx(xMax)-4}" y="${sy(0)-6}" text-anchor="end">x</text><text x="${sx(0)+8}" y="${sy(yMax)+12}">y</text>
  <line x1="${sx(cx)}" y1="${sy(0)}" x2="${sx(cx)}" y2="${sy(cy)}" stroke="#777" stroke-dasharray="4 4"/>
  <line x1="${sx(0)}" y1="${sy(cy)}" x2="${sx(cx)}" y2="${sy(cy)}" stroke="#777" stroke-dasharray="4 4"/>
  <circle cx="${sx(cx)}" cy="${sy(cy)}" r="${Math.abs(sx(cx+r)-sx(cx))}" fill="none" stroke="#111" stroke-width="1.8"/>
  <circle cx="${sx(cx)}" cy="${sy(cy)}" r="3" fill="#111"/>
  ${labels.map(l=>`<text x="${sx(l.x)}" y="${sy(l.y)}" text-anchor="${l.a||'middle'}">${l.t}</text>`).join("")}
  <text x="${sx(cx)}" y="${sy(0)+17}" text-anchor="middle">${cx}</text><text x="${sx(0)-8}" y="${sy(cy)+4}" text-anchor="end">${cy}</text>
  </svg>`;
}
function miniCircle(cx,cy,r,label){return `<div>${svgCircle(cx,cy,r,{xMin:-24,yMin:-8,xMax:34,yMax:28,labels:[{x:cx,y:cy+2,t:label},{x:0,y:-2,t:"P",a:"end"}]}).replace('class="fig"','class="smallfig"')}</div>`;}
function svgPolygon(){return `<svg class="fig" viewBox="0 0 360 260"><defs><marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#111"/></marker></defs><line x1="25" y1="220" x2="335" y2="220" stroke="#111" marker-end="url(#a2)"/><line x1="45" y1="238" x2="45" y2="20" stroke="#111" marker-end="url(#a2)"/><text x="340" y="216">x</text><text x="55" y="28">y</text><polygon points="92,196 300,196 300,92 196,40 92,92" fill="#eee" stroke="#111" stroke-width="3"/><text x="92" y="216">2</text><text x="300" y="216">10</text><text x="35" y="200">1</text><text x="35" y="96">5</text><text x="35" y="45">8</text><text x="88" y="188">A</text><text x="303" y="188">B</text><text x="306" y="92">C</text><text x="196" y="32">D</text><text x="78" y="92">E</text></svg>`;}
function svgHex(){return `<svg class="fig" viewBox="0 0 280 230"><polygon points="220,115 185,176 95,176 60,115 95,54 185,54" fill="#fff" stroke="#111" stroke-width="3"/><line x1="60" y1="115" x2="220" y2="115" stroke="#555" stroke-dasharray="7 5" stroke-width="2"/><circle cx="140" cy="115" r="3" fill="#111"/><text x="140" y="105" text-anchor="middle">18 cm</text><text x="140" y="136" text-anchor="middle">O</text></svg>`;}
function svgComposite(){return `<svg class="fig" viewBox="0 0 320 270"><path d="M80 220 L240 220 L240 100 A80 80 0 0 0 80 100 Z" fill="#eee" stroke="#111" stroke-width="3"/><g stroke="#bbb" stroke-dasharray="2 5">${Array.from({length:9},(_,i)=>`<line x1="${40+i*30}" y1="20" x2="${40+i*30}" y2="260"/><line x1="40" y1="${20+i*30}" x2="280" y2="${20+i*30}"/>`).join("")}</g></svg>`;}
function svgMural(){return `<svg class="fig" viewBox="0 0 240 220"><g fill="#eee" stroke="#111"><rect x="90" y="140" width="40" height="40"/><rect x="90" y="100" width="40" height="40"/><rect x="50" y="100" width="40" height="40"/><rect x="130" y="100" width="40" height="40"/><rect x="90" y="60" width="40" height="40"/></g><path d="M90 180 L130 180 L130 140 L170 140 L170 100 L130 100 L130 60 L90 60 L90 100 L50 100 L50 140 L90 140 Z" fill="none" stroke="#111" stroke-width="4"/><line x1="190" y1="100" x2="190" y2="140" stroke="#111"/><text x="198" y="125">4 dm</text></svg>`;}
function svgCone(){return `<svg class="fig" viewBox="0 0 310 250"><line x1="155" y1="25" x2="50" y2="210" stroke="#111" stroke-width="3"/><line x1="155" y1="25" x2="260" y2="210" stroke="#111" stroke-width="3"/><ellipse cx="155" cy="210" rx="105" ry="18" fill="none" stroke="#111" stroke-width="3"/><ellipse cx="155" cy="118" rx="63" ry="10" fill="none" stroke="#777" stroke-width="3"/><line x1="155" y1="25" x2="155" y2="210" stroke="#555" stroke-dasharray="6 5" stroke-width="2"/></svg>`;}
function svgSym(){return `<svg class="fig" viewBox="0 0 320 270"><polygon points="160,30 250,105 218,225 160,188 102,225 70,105" fill="#eee" stroke="#111" stroke-width="3"/><line x1="160" y1="238" x2="160" y2="18" stroke="#555" stroke-dasharray="7 5" stroke-width="2"/><line x1="35" y1="122" x2="285" y2="122" stroke="#777" stroke-dasharray="7 5" stroke-width="2"/><line x1="60" y1="230" x2="260" y2="30" stroke="#777" stroke-dasharray="7 5" stroke-width="2"/><line x1="60" y1="30" x2="260" y2="230" stroke="#777" stroke-dasharray="7 5" stroke-width="2"/><text x="165" y="24">h</text><text x="288" y="126">j</text><text x="263" y="33">k</text><text x="263" y="234">n</text></svg>`;}
function svgReflect(){return `<svg class="fig" viewBox="0 0 360 260"><defs><marker id="a3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#111"/></marker></defs><line x1="30" y1="220" x2="335" y2="220" stroke="#111" marker-end="url(#a3)"/><line x1="45" y1="235" x2="45" y2="25" stroke="#111" marker-end="url(#a3)"/><line x1="205" y1="220" x2="205" y2="35" stroke="#111" stroke-width="3"/><text x="214" y="38">r</text><line x1="98" y1="220" x2="98" y2="148" stroke="#777" stroke-dasharray="5 5"/><line x1="45" y1="148" x2="205" y2="148" stroke="#777" stroke-dasharray="5 5"/><circle cx="98" cy="148" r="4" fill="#111"/><text x="86" y="140">P</text><text x="98" y="238" text-anchor="middle">2</text><text x="205" y="238" text-anchor="middle">6</text><text x="36" y="152" text-anchor="end">3</text><text x="340" y="216">x</text><text x="55" y="34">y</text></svg>`;}
const ITEMS=[
{n:1,b:"Geometria",q:`<p>El alcance maximo de la senal inalambrica que emite un dispositivo es de 8 m a su alrededor. La ubicacion de ese dispositivo M es 20 m al este y 12 m al norte de la ubicacion de una casa P, la cual se considera como origen.</p><p>¿Cual de las siguientes representaciones graficas, en la que las unidades estan en metros, corresponde a la circunferencia del alcance maximo de la senal?</p>`,A:miniCircle(20,12,8,"M"),B:miniCircle(12,20,8,"M"),C:miniCircle(20,12,4,"M"),D:miniCircle(-20,12,8,"M"),k:"A",e:"La circunferencia debe tener centro en (20,12) y radio 8."},
{n:2,b:"Geometria",q:`<p>La siguiente representacion grafica, en la que las unidades estan en centimetros, muestra el centro P de la base circular de una pecera y la circunferencia correspondiente al borde de esa base.</p>${svgCircle(10,6,6,{xMin:-5,yMin:-5,xMax:25,yMax:16,labels:[{x:10,y:8,t:"P"}]})}<p>¿Cual es la representacion algebraica de la circunferencia?</p>`,A:"(x + 10)<sup>2</sup> + (y + 6)<sup>2</sup> = 36",B:"(x - 10)<sup>2</sup> + (y - 6)<sup>2</sup> = 36",C:"(x - 6)<sup>2</sup> + (y - 10)<sup>2</sup> = 36",D:"(x - 10)<sup>2</sup> + (y - 6)<sup>2</sup> = 6",k:"B",e:"El centro es (10,6) y el radio es 6, por tanto r al cuadrado es 36."},
{n:3,b:"Geometria",q:`<p>Una antena de telecomunicaciones T emite una senal que permite llamadas a telefonos ubicados a 13 km o menos alrededor de ella. La antena esta en T(5,12). Se registraron R(10,24), S(18,12) y U(17,18).</p>${svgCircle(5,12,13,{xMin:-4,yMin:-3,xMax:25,yMax:29,labels:[{x:5,y:14,t:"T"}]})}<p>¿En cual de esos telefonos se pueden realizar y recibir llamadas?</p>`,A:"Solo en R.",B:"Solo en S.",C:"En R y en S.",D:"En R, en S y en U.",k:"C",e:"R y S estan a 13 km del centro; U esta a mas de 13 km."},
{n:4,b:"Geometria",q:`<p>En una finca se desea construir un estanque circular para peces. El centro C se ubicara a 9 m al oeste y 4 m al sur de un arbol A, considerado como origen. El borde queda a 7 m del centro.</p>${svgCircle(-9,-4,7,{xMin:-20,yMin:-14,xMax:11,yMax:8,labels:[{x:-9,y:-2,t:"C"},{x:0,y:1,t:"A"}]})}<p>¿Cual representacion algebraica corresponde al borde de ese estanque?</p>`,A:"(x - 9)<sup>2</sup> + (y - 4)<sup>2</sup> = 49",B:"(x + 9)<sup>2</sup> + (y + 4)<sup>2</sup> = 49",C:"(x + 9)<sup>2</sup> + (y + 4)<sup>2</sup> = 7",D:"(x - 4)<sup>2</sup> + (y - 9)<sup>2</sup> = 49",k:"B",e:"El centro es (-9,-4) y el radio es 7, asi que r al cuadrado es 49."},
{n:5,b:"Geometria",q:`<p>En un plano cartesiano, la circunferencia C tiene centro en A(6,4) y radio 5. Se le aplica una traslacion de 8 unidades hacia la derecha y 3 unidades hacia abajo, obteniendo C'.</p><p>¿Cual representacion algebraica corresponde a C'?</p>`,A:"(x - 14)<sup>2</sup> + (y - 1)<sup>2</sup> = 25",B:"(x + 14)<sup>2</sup> + (y + 1)<sup>2</sup> = 25",C:"(x - 14)<sup>2</sup> + (y - 7)<sup>2</sup> = 25",D:"(x - 6)<sup>2</sup> + (y - 4)<sup>2</sup> = 25",k:"A",e:"El centro pasa de (6,4) a (14,1); el radio permanece 5."},
{n:6,b:"Geometria",q:`<p>Una piscina circular con centro A(4,3) y radio 4 se trasladara 12 unidades hacia la derecha y 5 hacia arriba.</p><p>¿Cual representacion grafica corresponde a esa traslacion?</p>`,A:"Centro trasladado en (12,8).",B:"Centro trasladado en (16,-2).",C:"Centro trasladado en (16,8).",D:"Centro trasladado en (9,15).",k:"C",e:"El nuevo centro es (4+12, 3+5) = (16,8)."},
{n:7,b:"Geometria",q:`<p>El borde de una zona circular esta representado por (x - 18)<sup>2</sup> + (y - 10)<sup>2</sup> = 36. Toda la zona se trasladara 7 m hacia el oeste y 4 m hacia el norte.</p><p>¿Cual sera la representacion algebraica despues de la traslacion?</p>`,A:"(x - 11)<sup>2</sup> + (y - 14)<sup>2</sup> = 36",B:"(x - 25)<sup>2</sup> + (y - 14)<sup>2</sup> = 36",C:"(x - 11)<sup>2</sup> + (y - 6)<sup>2</sup> = 36",D:"(x - 18)<sup>2</sup> + (y - 10)<sup>2</sup> = 36",k:"A",e:"El centro (18,10) se mueve a (11,14); el radio no cambia."},
{n:8,b:"Geometria",q:`<p>En un centro recreativo hay una fuente circular de 16 m de diametro. Un sendero rectilineo pasa por los puntos (20,4) y (20,14).</p>${svgCircle(10,9,8,{xMin:-1,yMin:-1,xMax:21,yMax:18,labels:[{x:10,y:11,t:"C"},{x:0,y:1,t:"O"}]})}<p>La recta que representa ese sendero, con respecto a la circunferencia, es</p>`,A:"exterior.",B:"secante.",C:"tangente.",D:"Ninguna de las anteriores.",k:"A",e:"La recta x=20 esta a 10 m del centro (10,9), distancia mayor que el radio 8."},
{n:9,b:"Geometria",q:`<p>Un juego consiste en lanzar una ficha hacia un objetivo circular de radio 5 m. El centro del objetivo es (9,8).</p>${svgCircle(9,8,5,{xMin:-1,yMin:-1,xMax:16,yMax:15,labels:[{x:9,y:10,t:""}]})}<p>Mariela: (12,12), Andres: (4,8), Valeria: (15,9), Esteban: (8,4). ¿Quien lanzo la ficha que se ubico en el exterior?</p>`,A:"Mariela.",B:"Andres.",C:"Valeria.",D:"Esteban.",k:"C",e:"Valeria esta a una distancia mayor que 5 del centro del objetivo."},
{n:10,b:"Geometria",q:`<p>Una rotonda circular tiene diametro 24 m. Las rectas h y j pasan por el centro, mientras k y n representan otros senderos.</p><p>De acuerdo con la informacion, ¿cuales rectas son perpendiculares entre si?</p>`,A:"j y k.",B:"h y j.",C:"k y n.",D:"j y n.",k:"B",e:"h es vertical y j es horizontal; por eso son perpendiculares."},
{n:11,b:"Geometria",q:`<p>Una antena emite una senal para telefonos que se encuentran a 6 km o menos. La circunferencia tiene centro (7,8) y radio 6.</p>${svgCircle(7,8,6,{xMin:-1,yMin:-1,xMax:16,yMax:15,labels:[{x:7,y:10,t:""}]})}<p>Si W, K, L y M corresponden a (10,12), (14,8), (2,2) y (7,15), respectivamente, ¿en cual telefono se pueden realizar llamadas?</p>`,A:"W",B:"K",C:"L",D:"M",k:"A",e:"W esta a 5 km del centro, dentro del alcance de 6 km."},
{n:12,b:"Geometria",q:`<p>En un centro educativo se destinara una zona con forma poligonal para construir un jardin.</p>${svgPolygon()}<p>¿Cuantos metros cuadrados mide el area de la zona?</p>`,A:"32",B:"40",C:"44",D:"56",k:"C",e:"Se puede descomponer en un rectangulo de area 32 y un triangulo de area 12; total 44."},
{n:13,b:"Geometria",q:`<p>Una empresa fabrica senales decorativas con forma de hexagono regular. La distancia entre dos vertices opuestos mide 18 cm.</p>${svgHex()}<p>Si se coloca una cinta alrededor del borde, ¿cuantos centimetros se necesitan?</p>`,A:"27",B:"36",C:"54",D:"108",k:"C",e:"En un hexagono regular, la distancia entre vertices opuestos es el doble del lado; el lado mide 9 y el perimetro 54."},
{n:14,b:"Geometria",q:`<p>Un artesano diseno una pieza decorativa sobre una cuadricula. Cada cuadrado mide 1 m de lado.</p>${svgComposite()}<p>La superficie de esa pieza, en metros cuadrados, es mayor que</p>`,A:"22 y menor que 23.",B:"18 y menor que 20.",C:"16 y menor que 18.",D:"24 y menor que 26.",k:"A",e:"La figura equivale a un rectangulo de 16 mas una semicircunferencia de radio 2, aproximadamente 22,28."},
{n:15,b:"Geometria",q:`<p>Para una actividad escolar se arma un mural con cinco piezas cuadradas congruentes. Cada pieza tiene 4 dm de lado.</p>${svgMural()}<p>Si se coloca una cinta alrededor del borde exterior, ¿cuantos decimetros se necesitan?</p>`,A:"32",B:"40",C:"48",D:"80",k:"C",e:"El borde exterior tiene 12 lados de una pieza; 12 x 4 = 48 dm."},
{n:16,b:"Geometria",q:`<p>En un taller se elaboran recuerdos a partir de esferas de acrilico. A cada esfera se le realiza un corte plano que pasa por el centro de la esfera.</p><p>La seccion plana obtenida corresponde a una</p>`,A:"circunferencia.",B:"hiperbola.",C:"parabola.",D:"recta.",k:"A",e:"Un plano que corta una esfera por su centro produce una circunferencia."},
{n:17,b:"Geometria",q:`<p>Una persona artesana trabaja con un cilindro circular recto de radio 8 cm y altura 24 cm. Realiza un corte plano que pasa por el centro de las bases y es perpendicular a estas.</p><p>¿Cual es el perimetro de la seccion plana obtenida?</p>`,A:"32 cm",B:"64 cm",C:"80 cm",D:"192 cm",k:"C",e:"La seccion es un rectangulo de lados 24 y 16; su perimetro es 2(24+16)=80."},
{n:18,b:"Geometria",q:`<p>Maria debe hacer cinco sombreros de cumpleanos. Cada sombrero tiene diametro 14 cm y altura 25 cm. Quiere pegar cinta formando una circunferencia paralela a la base y a 10 cm de altura sobre la base del cono.</p>${svgCone()}<p>¿Cuanta cinta debe comprar, aproximadamente, para los cinco sombreros?</p>`,A:"42 cm",B:"84 cm",C:"132 cm",D:"220 cm",k:"C",e:"A esa altura el radio es 4,2 cm; una circunferencia mide aproximadamente 26,4 cm y cinco miden 132 cm."},
{n:19,b:"Geometria",q:`<p>En una institucion educativa se diseno una pieza decorativa para la entrada del gimnasio.</p>${svgSym()}<p>¿Cual recta corresponde a un eje de simetria de la pieza?</p>`,A:"h",B:"j",C:"k",D:"n",k:"A",e:"La recta h divide la figura en dos partes congruentes que coinciden por reflexion."},
{n:20,b:"Geometria",q:`<p>En el diseno de un parque se desea ubicar dos postes de iluminacion de manera simetrica con respecto a un sendero rectilineo. El sendero esta representado por la recta r y el poste P esta en (2,3).</p>${svgReflect()}<p>Si Q debe ubicarse en el punto simetrico de P con respecto a r, ¿cuales son las coordenadas de Q?</p>`,A:"(4,3)",B:"(6,3)",C:"(8,3)",D:"(10,3)",k:"D",e:"La recta r es x=6; P esta 4 unidades a la izquierda, por lo que Q esta en x=10 con la misma coordenada y."}
];
let idx=0,res={},flags=new Set(),remaining=180*60,timerId=null,finished=false;
function iniciar(){document.getElementById("inicio").style.display="none";document.getElementById("top").style.display="block";document.getElementById("bar").style.display="flex";document.getElementById("progress").style.display="block";document.getElementById("progressText").style.display="block";timerId=setInterval(tick,1000);show(0)}
function tick(){remaining--;if(remaining<0){finish();return}const h=String(Math.floor(remaining/3600)).padStart(2,"0"),m=String(Math.floor(remaining%3600/60)).padStart(2,"0"),s=String(remaining%60).padStart(2,"0");const t=document.getElementById("timer");t.textContent=`${h}:${m}:${s}`;if(remaining<=300)t.classList.add("low")}
function show(i){if(finished)return;idx=i;const it=ITEMS[i],total=ITEMS.length,answered=Object.keys(res).length;document.getElementById("itemLabel").textContent=`Item ${i+1} de ${total}`;document.getElementById("progressBar").style.width=(answered/total*100)+"%";document.getElementById("progressText").textContent=`${answered} de ${total} respondidos`;let opts=["A","B","C","D"].map(l=>`<button class="opt ${res[i]===l?"sel":""}" onclick="choose('${l}')" id="opt-${l}"><span class="letter">${l})</span><span>${it[l]}</span></button>`).join("");let select=`<select onchange="show(Number(this.value))">${ITEMS.map((x,j)=>`<option value="${j}" ${j===i?"selected":""}>Item ${j+1}${flags.has(j)?" *":""}</option>`).join("")}</select>`;document.getElementById("area").innerHTML=`<article class="card item"><div class="item-head">Item ${i+1} | ${it.b}</div><div class="stem">${it.q}</div><div class="options">${opts}</div><div class="mark"><button class="${flags.has(i)?"on":""}" onclick="toggleFlag()">${flags.has(i)?"Marcado para revisar":"Marcar para revisar"}</button></div><div class="nav"><button class="btn muted" onclick="show(${i-1})" ${i===0?"disabled":""}>Anterior</button>${select}<button class="btn primary" onclick="show(${i+1})" ${i===total-1?"disabled":""}>Siguiente</button><button class="btn danger" onclick="askFinish()">Finalizar</button></div></article>`}
function choose(l){res[idx]=l;document.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));document.getElementById("opt-"+l).classList.add("sel");document.getElementById("progressBar").style.width=(Object.keys(res).length/ITEMS.length*100)+"%";document.getElementById("progressText").textContent=`${Object.keys(res).length} de ${ITEMS.length} respondidos`}
function toggleFlag(){flags.has(idx)?flags.delete(idx):flags.add(idx);show(idx)}
function askFinish(){const miss=ITEMS.length-Object.keys(res).length;if(miss>0&&!confirm(`Tiene ${miss} item(s) sin responder. ¿Desea finalizar?`))return;finish()}
function finish(){if(finished)return;finished=true;if(timerId)clearInterval(timerId);document.getElementById("area").innerHTML="";document.getElementById("top").style.display="none";document.getElementById("bar").style.display="none";document.getElementById("progress").style.display="none";document.getElementById("progressText").style.display="none";let ok=0,bad=0,skip=0;ITEMS.forEach((it,i)=>{if(!res[i])skip++;else if(res[i]===it.k)ok++;else bad++});const pct=Math.round(ok/ITEMS.length*100);let rows=ITEMS.map((it,i)=>{let r=res[i]||"-",state=r==="-"?"Omitido":(r===it.k?"Correcto":"Incorrecto"),cls=r==="-"?"omitted":(r===it.k?"correct":"wrong");return `<tr><td>${i+1}</td><td>${r}</td><td>${it.k}</td><td class="${cls}">${state}</td><td>${it.e}</td></tr>`}).join("");document.getElementById("results").style.display="block";document.getElementById("results").innerHTML=`<h1>Resultados</h1><div class="score">${pct}%</div><div class="stats"><div class="stat ok"><strong>${ok}</strong><br>Correctas</div><div class="stat bad"><strong>${bad}</strong><br>Incorrectas</div><div class="stat skip"><strong>${skip}</strong><br>Omitidas</div></div><div class="table-wrap"><table><thead><tr><th>Item</th><th>Respuesta</th><th>Clave</th><th>Resultado</th><th>Retroalimentacion</th></tr></thead><tbody>${rows}</tbody></table></div><button class="btn primary" style="display:block;margin:18px auto 0" onclick="location.reload()">Reiniciar</button>`}
</script>
</body>
</html>
