<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Práctica PSE Secundaria 2026 – Bloque 1</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f6fb;color:#202124;line-height:1.6}
.wrap{width:min(100%,900px);margin:auto;padding:18px}
.card{background:white;border:1px solid #d9dee8;border-radius:8px;box-shadow:0 2px 10px rgba(22,34,51,.08)}
.inicio{padding:36px;text-align:center;margin-top:28px}
h1{margin:0 0 8px;color:#15246b;font-size:1.5rem}
h2{margin:0;color:#334;font-size:1.1rem}
.sub{color:#596579;margin:10px 0 24px;font-size:.97rem}
.btn{border:0;border-radius:6px;padding:10px 18px;font-weight:700;cursor:pointer;font-size:1rem}
.primary{background:#1565c0;color:white}.primary:hover{background:#0d47a1}
.muted{background:#e8ecf3;color:#253044}
.danger{background:#b42318;color:white}
/* Header */
.top{display:none;background:#172b85;color:white;border-radius:8px 8px 0 0;padding:12px 18px}
.top h1{color:white;font-size:1rem;margin:0}
/* Barra temporizador */
.bar{display:none;align-items:center;justify-content:space-between;gap:10px;background:#243c9b;color:white;border-radius:0 0 8px 8px;padding:8px 18px;margin-bottom:14px;font-size:.92rem;flex-wrap:wrap}
.timer{font-weight:800;letter-spacing:.05em;font-size:1.1rem}
.timer.low{color:#ffd2d2;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.5}}
/* Barra de progreso */
.progress{display:none;height:8px;background:#dce3ef;border-radius:999px;overflow:hidden;margin-bottom:4px}
.progress span{display:block;height:100%;width:0;background:#1565c0;transition:width .3s}
.progress-text{display:none;text-align:right;color:#596579;font-size:.86rem;margin-bottom:12px}
/* Ítem */
.item{padding:22px}
.item-head{font-weight:800;color:#15246b;margin-bottom:12px;font-size:.95rem}
.stem{margin-bottom:6px}
.stem p{margin:0 0 10px}
/* Figuras SVG */
.fig{display:block;margin:14px auto;max-width:100%;height:auto;overflow:visible}
.fig text{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#111}
/* Minigráficos en grid */
.mini-grid{display:grid;grid-template-columns:repeat(2,minmax(200px,1fr));gap:12px;margin:14px auto;max-width:700px}
.mini-cell{display:flex;align-items:center;gap:8px}
.mini-cell .opt-letter{font-weight:800;font-size:1.05rem;min-width:28px}
/* Opciones */
.options{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;padding:11px 14px;background:#fbfcff;border:1.5px solid #c8d0dc;border-radius:6px;text-align:left;cursor:pointer;font-size:1rem;transition:background .15s,border-color .15s}
.opt:hover:not(:disabled){background:#eef4ff;border-color:#5f7ecf}
.opt.sel{background:#e8f1ff;border-color:#1565c0}
.opt.correct{background:#e7f6ec;border-color:#2e7d32}
.opt.wrong{background:#feeceb;border-color:#b42318}
.letter{font-weight:800;min-width:26px}
/* Marca */
.mark{margin-top:12px}
.mark button{background:#fff8e1;border:1px solid #e0a800;border-radius:5px;padding:5px 10px;color:#7b5900;cursor:pointer;font-size:.9rem}
.mark button.on{background:#ffecb3;font-weight:700}
/* Navegación */
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:18px}
select{padding:8px;border:1px solid #9aa4b2;border-radius:5px;font-size:.95rem}
/* Resultados */
.results{display:none;padding:28px}
.score{text-align:center;color:#15246b;font-size:2.4rem;font-weight:800;margin:12px 0}
.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:18px}
.stat{min-width:110px;text-align:center;border-radius:8px;padding:12px}
.ok{background:#e7f6ec;color:#176b36}
.bad{background:#feeceb;color:#b42318}
.skip{background:#fff6dc;color:#8a6100}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.91rem}
th{background:#e8ecff;color:#1f2b61}
th,td{border:1px solid #d9dee8;padding:7px 10px;text-align:center}
.correct-res{color:#176b36;font-weight:800}
.wrong-res{color:#b42318;font-weight:800}
.omitted-res{color:#8a6100;font-weight:800}
/* Figuras compiladas desde TikZ */
.figura-latex{display:block;margin:12px auto;max-width:100%;height:auto}
/* Math inline */
.math{font-family:"Times New Roman",serif;font-style:normal}
.sup{vertical-align:super;font-size:.75em}
@media(max-width:640px){
  .wrap{padding:10px}
  .mini-grid{grid-template-columns:1fr}
  .nav .btn,.nav select{width:100%;min-height:44px}
  .opt{min-height:44px}
  .score{font-size:1.9rem}
  h1{font-size:1.2rem}
}
</style>
</head>

<script>
// ─── SVG HELPERS ───────────────────────────────────────────────
function mkSvg(w,h,body,aria){
  return `<svg class="fig" viewBox="0 0 ${w} ${h}" role="img" aria-label="${aria||'figura'}">${body}</svg>`;
}
function arrowDef(id){
  return `<defs><marker id="${id}" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#111"/></marker><marker id="${id}b" markerWidth="7" markerHeight="7" refX="1" refY="3" orient="auto"><path d="M6,0 L0,3 L6,6 Z" fill="#111"/></marker></defs>`;
}

// Plano cartesiano genérico → coordenadas → pixels
function mkPlane(cfg){
  const {W=340,H=280,pad=34,xMin,xMax,yMin,yMax,label='fig'} = cfg;
  const sx = x => pad + (x-xMin)/(xMax-xMin)*(W-2*pad);
  const sy = y => H-pad - (y-yMin)/(yMax-yMin)*(H-2*pad);
  const id = 'a'+Math.random().toString(36).slice(2,6);
  let g = arrowDef(id);
  // Ejes
  g += `<line x1="${sx(xMin)}" y1="${sy(0)}" x2="${sx(xMax)}" y2="${sy(0)}" stroke="#111" stroke-width="1.8" marker-end="url(#${id})" marker-start="url(#${id}b)"/>`;
  g += `<line x1="${sx(0)}" y1="${sy(yMin)}" x2="${sx(0)}" y2="${sy(yMax)}" stroke="#111" stroke-width="1.8" marker-end="url(#${id})" marker-start="url(#${id}b)"/>`;
  return {g, sx, sy, W, H, id, pad, label};
}

// Mini gráfico con P en origen y círculo centrado en (cx,cy) radio r
// Usa SIEMPRE el mismo sistema de coordenadas fijo: x[-30,36] y[-12,31]
// (igual que \grafcirc en LaTeX, scale=0.078, bounding box (-32,-15)–(43,34))
function miniCircP(cx,cy,r,labelC,xLab,xMinOvr,xMaxOvr,yMinOvr,yMaxOvr){
  const W=220,pad=24;
  const xMin = xMinOvr!==undefined ? xMinOvr : -30;
  const xMax = xMaxOvr!==undefined ? xMaxOvr : 36;
  const yMin = yMinOvr!==undefined ? yMinOvr : -12;
  const yMax = yMaxOvr!==undefined ? yMaxOvr : 31;
  // H calculado para escala uniforme: mismos px/unidad en x e y
  const H = Math.round((yMax-yMin)*(W-2*pad)/(xMax-xMin)) + 2*pad;
  const p = mkPlane({W,H,pad,xMin,xMax,yMin,yMax});
  const {g:gg,sx,sy,id} = p;
  let g = gg;
  // Etiquetas ejes: "y (norte)" arriba del eje, "x (este)" al final del eje
  g += `<text x="${sx(xMax)-2}" y="${sy(0)+12}" text-anchor="end" font-size="9">x (este)</text>`;
  g += `<text x="${sx(0)+4}" y="${sy(yMax)+3}" font-size="9">y (norte)</text>`;
  // P en origen
  g += `<circle cx="${sx(0)}" cy="${sy(0)}" r="3" fill="#111"/>`;
  g += `<text x="${sx(0)-4}" y="${sy(0)+22}" text-anchor="end" font-size="9">P</text>`;
  // Guías al centro y al punto superior (cx, cy+r)
  g += `<line x1="${sx(cx)}" y1="${sy(0)}" x2="${sx(cx)}" y2="${sy(cy+r)}" stroke="#777" stroke-dasharray="4 3" stroke-width="1.1"/>`;
  g += `<line x1="${sx(0)}" y1="${sy(cy)}" x2="${sx(cx)}" y2="${sy(cy)}" stroke="#777" stroke-dasharray="4 3" stroke-width="1.1"/>`;
  g += `<line x1="${sx(0)}" y1="${sy(cy+r)}" x2="${sx(cx)}" y2="${sy(cy+r)}" stroke="#777" stroke-dasharray="4 3" stroke-width="1.1"/>`;
  // Círculo
  const rx = Math.abs(sx(cx+r)-sx(cx));
  g += `<circle cx="${sx(cx)}" cy="${sy(cy)}" r="${rx}" fill="none" stroke="#111" stroke-width="1.8"/>`;
  g += `<circle cx="${sx(cx)}" cy="${sy(cy)}" r="2.8" fill="#111"/>`;
  // Punto superior de la circunferencia
  g += `<circle cx="${sx(cx)}" cy="${sy(cy+r)}" r="2.8" fill="#111"/>`;
  // Etiqueta centro: a la derecha del punto, mismo nivel vertical
  g += `<text x="${sx(cx)+5}" y="${sy(cy)+3}" text-anchor="start" font-size="9" font-weight="bold">${labelC}</text>`;
  // Etiqueta numérica eje x debajo de "x (este)" para evitar superposición
  g += `<text x="${sx(cx)}" y="${sy(0)+22}" text-anchor="middle" font-size="9">${xLab}</text>`;
  g += `<text x="${sx(0)-4}" y="${sy(cy)+4}" text-anchor="end" font-size="9">${cy}</text>`;
  g += `<text x="${sx(0)-4}" y="${sy(cy+r)+4}" text-anchor="end" font-size="9">${cy+r}</text>`;
  return mkSvg(W,H,g,'mini grafico circunferencia');
}

// Mini gráfico SIN punto P: nueva posición tras traslación
// Usa SIEMPRE el mismo sistema de coordenadas fijo: x[-1,10] y[-1,10]
// (igual que \grafpos en LaTeX, scale=0.35, bounding box (-2,-1)–(11,11))
function miniCircNP(cx,cy,r,labelC,xLab,yMaxOvr){
  const W=200,pad=26;
  const xMin=-1,xMax=10,yMin=-1,yMax=yMaxOvr!==undefined ? yMaxOvr : 11;
  const H = Math.round((yMax-yMin)*(W-2*pad)/(xMax-xMin)) + 2*pad;
  const p = mkPlane({W,H,pad,xMin,xMax,yMin,yMax});
  const {g:gg,sx,sy} = p;
  let g = gg;
  g += `<text x="${sx(xMax)-2}" y="${sy(0)+12}" text-anchor="end" font-size="9">x</text>`;
  g += `<text x="${sx(0)+4}" y="${sy(yMax)+3}" font-size="9">y</text>`;
  // Guías al centro y al punto superior (cx, cy+r)
  g += `<line x1="${sx(cx)}" y1="${sy(0)}" x2="${sx(cx)}" y2="${sy(cy+r)}" stroke="#777" stroke-dasharray="4 3" stroke-width="1.1"/>`;
  g += `<line x1="${sx(0)}" y1="${sy(cy)}" x2="${sx(cx)}" y2="${sy(cy)}" stroke="#777" stroke-dasharray="4 3" stroke-width="1.1"/>`;
  g += `<line x1="${sx(0)}" y1="${sy(cy+r)}" x2="${sx(cx)}" y2="${sy(cy+r)}" stroke="#777" stroke-dasharray="4 3" stroke-width="1.1"/>`;
  // Círculo
  const rx = Math.abs(sx(cx+r)-sx(cx));
  g += `<circle cx="${sx(cx)}" cy="${sy(cy)}" r="${rx}" fill="none" stroke="#111" stroke-width="1.8"/>`;
  g += `<circle cx="${sx(cx)}" cy="${sy(cy)}" r="2.8" fill="#111"/>`;
  // Punto superior de la circunferencia
  g += `<circle cx="${sx(cx)}" cy="${sy(cy+r)}" r="2.8" fill="#111"/>`;
  g += `<text x="${sx(cx)+3}" y="${sy(cy)-5}" text-anchor="start" font-size="9" font-weight="bold">${labelC}</text>`;
  g += `<text x="${sx(cx)}" y="${sy(0)+22}" text-anchor="middle" font-size="9">${xLab}</text>`;
  g += `<text x="${sx(0)-4}" y="${sy(cy)+4}" text-anchor="end" font-size="9">${cy}</text>`;
  g += `<text x="${sx(0)-4}" y="${sy(cy+r)+4}" text-anchor="end" font-size="9">${cy+r}</text>`;
  return mkSvg(W,H,g,'mini grafico posicion');
}

// ─── OPCIONES ALGEBRAICAS como HTML ────────────────────────────
function algebraOpts(opts){
  return opts.map((o,i)=>{
    const L=['A','B','C','D'][i];
    return `<button class="opt" onclick="choose('${L}')" id="opt-${L}">
      <span class="letter">${L})</span><span>${o}</span>
    </button>`;
  }).join('');
}

// Superíndice inline
function sup2(n){ return `(…)<sup class="sup">2</sup>`; }
function eq(a,b,c,d,r2){
  // (x-a)²+(y-b)²=r² con soporte de signos
  const xs = a===0 ? 'x' : (a>0 ? `(x &minus; ${a})` : `(x + ${Math.abs(a)})`);
  const ys = b===0 ? 'y' : (b>0 ? `(y &minus; ${b})` : `(y + ${Math.abs(b)})`);
  return `<span class="math">${xs}<sup>2</sup> + ${ys}<sup>2</sup> = ${r2}</span>`;
}

// ─── ESTADO ────────────────────────────────────────────────────
let idx=0, res={}, flags=new Set(), remaining=21*60, timerId=null, finished=false;

function iniciar(){
  document.getElementById('inicio').style.display='none';
  document.getElementById('top').style.display='block';
  document.getElementById('bar').style.display='flex';
  document.getElementById('progress').style.display='block';
  document.getElementById('progressText').style.display='block';
  timerId = setInterval(tick,1000);
  show(0);
}

function tick(){
  remaining--;
  if(remaining<0){finish();return;}
  const m=String(Math.floor(remaining/60)).padStart(2,'0');
  const s=String(remaining%60).padStart(2,'0');
  const t=document.getElementById('timer');
  t.textContent=`${m}:${s}`;
  if(remaining<=120) t.classList.add('low');
}

function show(i){
  if(finished) return;
  idx=i;
  const it=ITEMS[i], total=ITEMS.length;
  const answered=Object.keys(res).length;
  document.getElementById('itemLabel').textContent=`Ítem ${i+1} de ${total}`;
  document.getElementById('progressBar').style.width=(answered/total*100)+'%';
  document.getElementById('progressText').textContent=`${answered} de ${total} respondidos`;

  let optsHtml='';
  if(it.graphOpts){
    // Opciones gráficas: mini-grid con SVG
    const useMiniP = it.n===1; // ítem 1 usa P en origen
    optsHtml = `<div class="mini-grid">${it.graphOpts.map(o=>{
      const svg = useMiniP
        ? miniCircP(o.cx,o.cy,o.r,o.l,o.xl,o.xMinOvr,o.xMaxOvr,o.yMinOvr,o.yMaxOvr)
        : miniCircNP(o.cx,o.cy,o.r,o.l,o.xl,o.yMaxOvr);
      const sel = res[i]===o.label ? 'style="outline:2.5px solid #1565c0;border-radius:6px;"' : '';
      return `<div class="mini-cell" ${sel} id="gcell-${o.label}" onclick="chooseGraph('${o.label}')" style="cursor:pointer;padding:6px;border-radius:6px;border:1.5px solid #d0d7e4;">
        <span class="opt-letter">${o.label})</span>${svg}</div>`;
    }).join('')}</div>`;
  } else {
    const letters=['A','B','C','D'];
    optsHtml=`<div class="options">${letters.map(l=>`
      <button class="opt ${res[i]===l?'sel':''}" onclick="choose('${l}')" id="opt-${l}">
        <span class="letter">${l})</span><span>${it[l]}</span>
      </button>`).join('')}</div>`;
  }

  const select=`<select onchange="show(Number(this.value))">${ITEMS.map((x,j)=>
    `<option value="${j}" ${j===i?'selected':''}>Ítem ${j+1}${flags.has(j)?' *':''}</option>`).join('')}</select>`;

  document.getElementById('area').innerHTML=`
    <article class="card item">
      <div class="item-head">Ítem ${i+1} | ${it.b}</div>
      <div class="stem">${it.q}</div>
      ${optsHtml}
      <div class="mark"><button class="${flags.has(i)?'on':''}" onclick="toggleFlag()">
        ${flags.has(i)?'★ Marcado para revisar':'☆ Marcar para revisar'}</button></div>
      <div class="nav">
        <button class="btn muted" onclick="show(${i-1})" ${i===0?'disabled':''}>← Anterior</button>
        ${select}
        <button class="btn primary" onclick="show(${i+1})" ${i===total-1?'disabled':''}>Siguiente →</button>
        <button class="btn danger" onclick="askFinish()">Finalizar</button>
      </div>
    </article>`;
}

function choose(l){
  res[idx]=l;
  document.querySelectorAll('.opt').forEach(b=>b.classList.remove('sel'));
  const el=document.getElementById('opt-'+l);
  if(el) el.classList.add('sel');
  updateProgress();
}

function chooseGraph(l){
  res[idx]=l;
  document.querySelectorAll('.mini-cell').forEach(c=>{
    c.style.outline='none';
    c.style.borderColor='#d0d7e4';
  });
  const el=document.getElementById('gcell-'+l);
  if(el){el.style.outline='2.5px solid #1565c0';el.style.borderColor='#1565c0';}
  updateProgress();
}

function updateProgress(){
  const answered=Object.keys(res).length;
  document.getElementById('progressBar').style.width=(answered/ITEMS.length*100)+'%';
  document.getElementById('progressText').textContent=`${answered} de ${ITEMS.length} respondidos`;
}

function toggleFlag(){
  flags.has(idx)?flags.delete(idx):flags.add(idx);
  show(idx);
}

function askFinish(){
  const miss=ITEMS.length-Object.keys(res).length;
  if(miss>0 && !confirm(`Tiene ${miss} ítem(s) sin responder. ¿Desea finalizar igualmente?`)) return;
  finish();
}

function finish(){
  if(finished) return;
  finished=true;
  if(timerId) clearInterval(timerId);
  document.getElementById('area').innerHTML='';
  document.getElementById('top').style.display='none';
  document.getElementById('bar').style.display='none';
  document.getElementById('progress').style.display='none';
  document.getElementById('progressText').style.display='none';

  let ok=0,bad=0,skip=0;
  ITEMS.forEach((it,i)=>{
    if(!res[i]) skip++;
    else if(res[i]===it.k) ok++;
    else bad++;
  });
  const pct=Math.round(ok/ITEMS.length*100);

  const rows=ITEMS.map((it,i)=>{
    const r=res[i]||'—';
    const state=r==='—'?'Omitido':(r===it.k?'Correcto':'Incorrecto');
    const cls=r==='—'?'omitted-res':(r===it.k?'correct-res':'wrong-res');
    return `<tr><td>${i+1}</td><td>${r}</td><td>${it.k}</td>
      <td class="${cls}">${state}</td>
      <td style="text-align:left;font-size:.88rem">${it.e}</td></tr>`;
  }).join('');

  document.getElementById('results').style.display='block';
  document.getElementById('results').innerHTML=`
    <h1 style="color:#15246b;text-align:center">Resultados de la Práctica</h1>
    <div class="score">${pct}%</div>
    <div class="stats">
      <div class="stat ok"><strong>${ok}</strong><br>Correctas</div>
      <div class="stat bad"><strong>${bad}</strong><br>Incorrectas</div>
      <div class="stat skip"><strong>${skip}</strong><br>Omitidas</div>
    </div>
    <div class="table-wrap"><table>
      <thead><tr>
        <th>Ítem</th><th>Respuesta</th><th>Clave</th><th>Resultado</th><th>Retroalimentación</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <button class="btn primary" style="display:block;margin:20px auto 0" onclick="location.reload()">
      Reiniciar práctica
    </button>`;
}
</script>
</body>
</html>
